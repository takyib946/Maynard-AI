
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Maynard AI - Your intelligent multilingual assistant with mathematical notation and image understanding.">
<meta name="theme-color" content="#030312">

<title>Maynard AI</title>

<style>
:root {
  --bg:#030312;
  --bar:#05051a;
  --panel:#080820;
  --line:#1b1b40;
  --btn:#232a40;
  --user:#101044;
  --ink:#f2f4fa;
  --muted:#8a90a8;
  --accent:#7886ff;
  --err:#ff8a80;
}

* {
  box-sizing:border-box;
}

html,body {
  height:100%;
  margin:0;
}

body {
  display:flex;
  flex-direction:column;
  background:radial-gradient(120% 40% at 0% 0%,#10104a 0%,var(--bg) 55%);
  color:var(--ink);
  font:16px/1.6 Roboto,system-ui,sans-serif;
}

button {
  font:inherit;
  color:inherit;
  cursor:pointer;
  border:0;
}

button:focus-visible,
textarea:focus-visible,
input:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* HEADER */

header {
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 16px;
  background:var(--bar);
  border-bottom:1px solid var(--line);
}

header h1 {
  flex:1;
  margin:0;
  font-size:1.1rem;
  font-weight:700;
}

#menu {
  width:40px;
  height:38px;
  background:#171735;
  border-radius:10px;
  font-size:1.2rem;
}

#voice {
  padding:10px 14px;
  background:var(--btn);
  border-radius:10px;
  font-weight:500;
}

#voice[aria-pressed="true"] {
  background:#3a4a9a;
}

/* DRAWER */

#scrim {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
  z-index:20;
}

#scrim.open {
  opacity:1;
  pointer-events:auto;
}

#drawer {
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:min(86vw,320px);
  background:var(--bar);
  border-right:1px solid var(--line);
  padding:16px;
  overflow-y:auto;
  transform:translateX(-100%);
  transition:transform .2s;
  z-index:21;
  visibility:hidden;
}

#drawer.open {
  transform:none;
  visibility:visible;
}

#drawer h2 {
  margin:18px 0 6px;
  font-size:.85rem;
  font-weight:500;
  color:var(--muted);
}

.wide {
  width:100%;
  padding:12px;
  background:var(--user);
  border-radius:10px;
  font-weight:600;
  text-align:left;
}

.wide.ghost {
  background:var(--btn);
  margin-top:18px;
}

.item {
  display:flex;
  align-items:center;
}

.item button:first-child {
  flex:1;
  padding:9px 10px;
  text-align:left;
  background:none;
  border-radius:8px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.item button[aria-current="true"] {
  background:var(--user);
}

.item .del {
  padding:6px 10px;
  background:none;
  color:var(--muted);
}

.empty {
  color:var(--muted);
  font-size:.9rem;
  padding:4px 10px;
}

/* CHAT */

#log {
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.row {
  display:flex;
  gap:12px;
  align-items:flex-start;
  max-width:100%;
}

.row.user {
  flex-direction:row-reverse;
  align-self:flex-end;
}

.avatar {
  flex:none;
  min-width:44px;
  height:44px;
  padding:0 10px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:#071a2a;
  font-weight:700;
  font-size:.9rem;
}

.row.user .avatar {
  background:#0a0a2a;
}

.col {
  min-width:0;
  max-width:min(85%,600px);
}

.bubble {
  padding:14px 18px;
  border-radius:18px;
  border:1px solid var(--line);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.row.assistant .bubble {
  background:var(--panel);
}

.row.user .bubble {
  background:var(--user);
}

.bubble.error {
  color:var(--err);
}

.bubble code {
  background:#0d0d33;
  padding:2px 5px;
  border-radius:5px;
  font:.9em ui-monospace,Menlo,monospace;
}

.bubble pre {
  margin:10px 0;
  padding:12px;
  background:#02020c;
  border:1px solid var(--line);
  border-radius:10px;
  overflow-x:auto;
  white-space:pre;
}

.bubble pre code {
  background:none;
  padding:0;
}

/* MATHEMATICAL NOTATION */

.math-display {
  display:block;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  padding:17px 12px;
  margin:14px 0;
  background:#0b0b2a;
  border:1px solid #252554;
  border-radius:12px;
  color:#ffffff;
  text-align:center;
  font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;
  font-size:1.3rem;
  line-height:2;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.math-inline {
  display:inline;
  color:#b9c4ff;
  font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;
  font-size:1.08em;
  font-weight:500;
}

.math-display::-webkit-scrollbar {
  height:4px;
}

.math-display::-webkit-scrollbar-thumb {
  background:#5555a0;
  border-radius:10px;
}

.bubble p {
  margin:7px 0;
}

.bubble ul,
.bubble ol {
  padding-left:24px;
}

.bubble li {
  margin:5px 0;
}

.bubble strong {
  color:#ffffff;
}

.thumbs {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:8px;
}

.thumbs img {
  max-width:100%;
  max-height:220px;
  border-radius:10px;
}

.note {
  color:var(--muted);
  font-size:.85rem;
  margin-bottom:6px;
}

.actions {
  display:flex;
  gap:18px;
  padding:6px 8px;
}

.actions button {
  background:none;
  color:var(--muted);
  font-size:.9rem;
  padding:2px 0;
}

/* COMPOSER */

form#composer {
  margin:0 12px;
  padding:14px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
}

#hint {
  color:var(--err);
  font-size:.85rem;
  min-height:0;
}

#chips {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

#chips:not(:empty) {
  margin-bottom:8px;
}

.chip {
  position:relative;
}

.chip img {
  width:64px;
  height:64px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--line);
  display:block;
}

.chip button {
  position:absolute;
  top:-6px;
  right:-6px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#444;
  font-size:.75rem;
  line-height:1;
}

textarea {
  width:100%;
  min-height:44px;
  max-height:160px;
  resize:none;
  border:0;
  background:none;
  color:var(--ink);
  font:inherit;
  padding:4px;
}

textarea::placeholder {
  color:var(--muted);
}

.tools {
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}

.tools .icon {
  width:52px;
  height:48px;
  background:var(--btn);
  border-radius:12px;
  font-size:1.2rem;
}

.tools .icon.on {
  background:#a33;
}

.tools .icon:disabled {
  opacity:.4;
  cursor:default;
}

#send {
  margin-left:auto;
  padding:13px 22px;
  background:#252c78;
  border-radius:12px;
  font-weight:700;
}

footer {
  padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
  text-align:center;
  color:var(--muted);
  font-size:.8rem;
}

/* SETTINGS */

dialog {
  width:min(92vw,440px);
  background:var(--bar);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
}

dialog::backdrop {
  background:rgba(0,0,0,.6);
}

dialog h2 {
  margin:0 0 10px;
  font-size:1.1rem;
}

dialog label {
  display:block;
  margin-top:12px;
  font-size:.9rem;
  color:var(--muted);
}

dialog input {
  width:100%;
  margin-top:4px;
  padding:10px;
  font:inherit;
  color:var(--ink);
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:8px;
}

dialog p {
  font-size:.85rem;
  color:var(--muted);
  margin:10px 0 0;
}

dialog a {
  color:var(--accent);
}

.dlg-actions {
  display:flex;
  gap:10px;
  margin-top:16px;
}

.dlg-actions button {
  padding:10px 16px;
  border-radius:10px;
  background:var(--btn);
}

.dlg-actions .primary {
  background:#2a3bd0;
  font-weight:700;
  margin-left:auto;
}

@media(max-width:480px) {
  #log {
    padding:12px;
  }

  .bubble {
    padding:12px;
  }

  .col {
    max-width:88%;
  }

  .math-display {
    font-size:1.15rem;
  }
}

@media(prefers-reduced-motion:reduce) {
  #scrim,#drawer {
    transition:none;
  }
}

@media(prefers-reduced-motion:no-preference) {
  #log {
    scroll-behavior:smooth;
  }
}
</style>
</head>

<body>

<header>
  <button id="menu" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
  <h1 id="title">General Assistant</h1>
  <button id="voice" type="button" aria-pressed="false">🔊 Voice</button>
</header>

<div id="scrim"></div>

<aside id="drawer" aria-label="Menu">

  <button id="newChat" class="wide" type="button">＋ New chat</button>

  <h2>Assistants</h2>
  <div id="assistants"></div>

  <h2>Recent chats</h2>
  <div id="recent"></div>

  <button id="openSettings" class="wide ghost" type="button">⚙️ Settings</button>

</aside>

<main id="log" aria-live="polite"></main>

<form id="composer">

  <div id="hint" role="status"></div>

  <div id="chips"></div>

  <textarea
    id="input"
    rows="1"
    placeholder="Message Maynard AI..."
    aria-label="Message"
  ></textarea>

  <div class="tools">

    <button class="icon" id="attach" type="button" aria-label="Attach images">📎</button>

    <button class="icon" id="mic" type="button" aria-label="Dictate">🎙️</button>

    <input id="file" type="file" accept="image/*" multiple hidden>

    <button id="send" type="submit">Send ➤</button>

  </div>

</form>

<footer>
  Maynard AI can make mistakes. Check important answers.
</footer>

<dialog id="settings">

  <h2>Settings</h2>

  <label>
    Your own Anthropic API key (optional)
    <input id="keyInput" type="password" autocomplete="off" placeholder="sk-ant-...">
  </label>

  <label>
    Model
    <input id="modelInput" type="text" autocomplete="off">
  </label>

  <p>
    Leave the key blank to use this site's built-in assistant.
    If you enter a key, it is stored in this browser and sent to Anthropic.
    Get one at
    <a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a>.
  </p>

  <div class="dlg-actions">

    <button id="clearData" type="button">Delete saved chats</button>

    <button id="saveSettings" class="primary" type="button">Save</button>

  </div>

</dialog>

<script>
(() => {
"use strict";

/* ==========================================
   MAYNARD AI CONFIGURATION
========================================== */

const API_URL = "https://api.anthropic.com/v1/messages";

const DEFAULT_MODEL = "claude-sonnet-5-5";

const MAX_IMAGES = 4;


/* ==========================================
   ASSISTANTS
========================================== */

const ASSISTANTS = [

  {
    id:"general",
    name:"General Assistant",
    icon:"💬",

    greeting:"Hello! I'm Maynard AI. How can I help you today?",

    system:`You are Maynard AI, a helpful, intelligent, accurate and friendly multilingual general assistant.

Answer clearly and naturally.

Support different subjects including education, science, technology, business, mathematics, programming, creativity and everyday questions.

Use clear formatting, headings and examples when helpful.

Be honest about limitations.`
  },

  {
    id:"writer",
    name:"Writing Helper",
    icon:"✍️",

    greeting:"What are we writing? Share your draft or tell me what you need.",

    system:`You are Maynard AI Writing Helper.

Help users write, rewrite, proofread and improve content.

Support emails, essays, articles, stories, speeches, reports, letters and professional documents.

Preserve the user's intended meaning.

Use appropriate grammar, vocabulary, tone and formatting.`
  },

  {
    id:"coder",
    name:"Coding Helper",
    icon:"💻",

    greeting:"Welcome to Coding Helper. Share your code or describe your project.",

    system:`You are Maynard AI Coding Helper.

You are an experienced programming tutor and software development assistant.

Support HTML, CSS, JavaScript, Python, Java, PHP, SQL, React, Node.js and other programming languages.

Provide complete working code when requested.

Explain important sections and identify errors.

Never pretend code has been tested when it has not.`
  },

  {
    id:"tutor",
    name:"Study Tutor",
    icon:"🎓",

    greeting:"Welcome to Study Tutor. What subject are you studying?",

    system:`You are Maynard AI Study Tutor.

Teach concepts step by step using simple explanations, examples and clear definitions.

Support school and university subjects.

Help learners understand concepts rather than simply memorize answers.

Create revision notes and practice questions when requested.

Explain difficult topics patiently.`
  },

  {
    id:"math",
    name:"Math Solver",
    icon:"➗",

    greeting:"Welcome to Math Solver. Send a mathematics question or upload a picture.",

    system:`You are Maynard AI Math Solver and Mathematics Tutor.

Solve mathematics questions accurately and explain every important step.

MANDATORY FORMATTING:

1. Identify the given information.
2. State the method or formula.
3. Show the substitution.
4. Show each calculation on a separate line.
5. Explain the reasoning.
6. Give the final answer clearly.
7. Verify the result whenever possible.

MATHEMATICAL NOTATION:

Use readable mathematical symbols such as:

× ÷ ± √ ∛ π θ α β
≤ ≥ ≠ ≈ ∞ ∑ ∫ ∂
→ ⇒ ∈ ∉ ∴

Use proper powers:
x², x³, x⁴, xⁿ.

Use subscripts:
a₁, a₂, x₁, x₂.

Use clear fractions:
(a + b)/(c + d).

Use standard algebraic notation:
2x + 5 = 15.

Use quadratic notation:
ax² + bx + c = 0.

Avoid writing unnecessary LaTeX commands.

When using display equations, put them between $$ and $$.

Put every important equation on its own line.

Do not compress multiple calculation steps into one paragraph.

Make mathematics readable on mobile screens.`
  },

  {
    id:"translator",
    name:"Translator",
    icon:"🌐",

    greeting:"Welcome to Translator. Which language would you like to use?",

    system:`You are Maynard AI Translator.

Translate naturally and accurately.

Support English, Twi, Akan, French, Spanish, German and other languages.

Preserve the original meaning, tone and context.

If the target language is unclear, ask the user.`
  }

];


/* ==========================================
   LOCAL STORAGE
========================================== */

const store = {

  get(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value ? JSON.parse(value) : fallback;
    } catch(error) {
      return fallback;
    }
  },

  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch(error) {
      console.warn("Storage unavailable:", error);
    }
  }

};


/* ==========================================
   ELEMENTS
========================================== */

const $ = selector => document.querySelector(selector);

const log = $("#log");
const input = $("#input");
const form = $("#composer");

const sendBtn = $("#send");
const voiceBtn = $("#voice");
const micBtn = $("#mic");

const chipsEl = $("#chips");
const hintEl = $("#hint");

const drawer = $("#drawer");
const scrim = $("#scrim");
const dlg = $("#settings");


/* ==========================================
   APPLICATION STATE
========================================== */

let settings = Object.assign(
  {
    key:"",
    model:DEFAULT_MODEL
  },
  store.get("maynard.settings", {})
);

let chats = store.get("maynard.chats", []);

let assistant =
  ASSISTANTS.find(
    a => a.id === store.get("maynard.assistant","general")
  ) || ASSISTANTS[0];

let chat;

let pending = [];

let busy = false;
let controller = null;
let autoSpeak = false;
let hintTimer = 0;


/* ==========================================
   CHAT MANAGEMENT
========================================== */

function newChat() {

  return {
    id:Date.now().toString(36),
    assistantId:assistant.id,
    title:"New chat",
    messages:[]
  };

}


/* ==========================================
   SAFE HTML ESCAPING
========================================== */

function esc(value) {

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==========================================
   MATHEMATICAL NOTATION ENGINE
========================================== */

function convertMathNotation(text) {

  // Convert square roots and fractions before
  // replacing the main mathematical commands.

  text = text.replace(
    /\\sqrt(?:\[(\d+)\])?\{([^{}]+)\}/g,
    (_, degree, value) => {
      return degree
        ? `ᵏ√(${value})`.replace("ᵏ", degree)
        : `√(${value})`;
    }
  );

  text = text.replace(
    /\\frac\{([^{}]+)\}\{([^{}]+)\}/g,
    "($1)/($2)"
  );

  text = text.replace(
    /\\dfrac\{([^{}]+)\}\{([^{}]+)\}/g,
    "($1)/($2)"
  );

  text = text.replace(
    /\\tfrac\{([^{}]+)\}\{([^{}]+)\}/g,
    "($1)/($2)"
  );

  const symbols = {

    "\\times":"×",
    "\\div":"÷",
    "\\cdot":"·",
    "\\pm":"±",
    "\\mp":"∓",

    "\\neq":"≠",
    "\\ne":"≠",

    "\\leq":"≤",
    "\\le":"≤",

    "\\geq":"≥",
    "\\ge":"≥",

    "\\approx":"≈",
    "\\equiv":"≡",

    "\\infty":"∞",
    "\\pi":"π",

    "\\theta":"θ",
    "\\alpha":"α",
    "\\beta":"β",
    "\\gamma":"γ",
    "\\delta":"δ",

    "\\Delta":"Δ",
    "\\lambda":"λ",
    "\\mu":"μ",
    "\\sigma":"σ",
    "\\omega":"ω",

    "\\Sigma":"Σ",
    "\\Omega":"Ω",

    "\\sum":"∑",
    "\\int":"∫",
    "\\oint":"∮",

    "\\partial":"∂",
    "\\nabla":"∇",

    "\\rightarrow":"→",
    "\\leftarrow":"←",
    "\\Rightarrow":"⇒",
    "\\Leftrightarrow":"⇔",

    "\\in":"∈",
    "\\notin":"∉",
    "\\subset":"⊂",
    "\\supset":"⊃",

    "\\therefore":"∴",
    "\\because":"∵",

    "\\degree":"°",
    "\\circ":"°",

    "\\emptyset":"∅",
    "\\forall":"∀",
    "\\exists":"∃"

  };

  for (const [command,symbol] of Object.entries(symbols)) {

    text = text.split(command).join(symbol);

  }


  // Superscripts

  const superscripts = {

    "0":"⁰",
    "1":"¹",
    "2":"²",
    "3":"³",
    "4":"⁴",
    "5":"⁵",
    "6":"⁶",
    "7":"⁷",
    "8":"⁸",
    "9":"⁹",

    "+":"⁺",
    "-":"⁻",
    "=":"⁼",

    "n":"ⁿ",
    "i":"ⁱ"

  };


  text = text.replace(
    /\^\{([^{}]+)\}|\^([0-9n+-])/g,

    (match,grouped,single) => {

      const value = grouped || single;

      return [...value]
        .map(character => superscripts[character] || character)
        .join("");

    }
  );


  // Subscripts

  const subscripts = {

    "0":"₀",
    "1":"₁",
    "2":"₂",
    "3":"₃",
    "4":"₄",
    "5":"₅",
    "6":"₆",
    "7":"₇",
    "8":"₈",
    "9":"₉",

    "+":"₊",
    "-":"₋",
    "=":"₌",

    "i":"ᵢ",
    "n":"ₙ"

  };


  text = text.replace(
    /_\{([^{}]+)\}|_([0-9in+-])/g,

    (match,grouped,single) => {

      const value = grouped || single;

      return [...value]
        .map(character => subscripts[character] || character)
        .join("");

    }
  );


  // Common LaTeX formatting commands.

  text = text.replace(
    /\\(?:mathrm|mathbf|mathit|text|operatorname)\{([^{}]*)\}/g,
    "$1"
  );

  text = text.replace(
    /\\(?:quad|qquad|,|;|!|:)/g,
    " "
  );

  text = text.replace(
    /\\(?:left|right)/g,
    ""
  );

  // Remove remaining simple braces.

  text = text.replace(/[{}]/g,"");

  return text;

}


/* ==========================================
   MARKDOWN AND MATH RENDERER
========================================== */

function md(text) {

  return String(text).split("```").map((part,index) => {

    // Preserve code blocks.

    if (index % 2) {

      return "<pre><code>" +
        esc(part.replace(/^[A-Za-z0-9+#-]*\n/,"")) +
        "</code></pre>";

    }

    const mathBlocks = [];


    function stashMath(value,display) {

      mathBlocks.push({

        value:convertMathNotation(value),
        display

      });

      return "\uE000" + (mathBlocks.length - 1) + "\uE001";

    }


    let processed = part;


    // Display equations.

    processed = processed.replace(
      /\$\$([\s\S]+?)\$\$/g,
      (_,value) => stashMath(value,true)
    );


    processed = processed.replace(
      /\\\[([\s\S]+?)\\\]/g,
      (_,value) => stashMath(value,true)
    );


    // Inline equations.

    processed = processed.replace(
      /\\\(([\s\S]+?)\\\)/g,
      (_,value) => stashMath(value,false)
    );


    processed = processed.replace(
      /\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\d)/g,
      (_,value) => stashMath(value,false)
    );


    // Escape HTML before formatting.

    let html = esc(processed);


    // Markdown formatting.

    html = html

      .replace(
        /`([^`\n]+)`/g,
        "<code>$1</code>"
      )

      .replace(
        /\*\*([^*\n]+)\*\*/g,
        "<strong>$1</strong>"
      )

      .replace(
        /\*([^*\n]+)\*/g,
        "<em>$1</em>"
      );


    // Restore mathematical expressions.

    html = html.replace(
      /\uE000(\d+)\uE001/g,

      (_,number) => {

        const math = mathBlocks[Number(number)];

        if (!math) return "";

        const className = math.display
          ? "math-display"
          : "math-inline";

        return `<span class="${className}">${esc(math.value)}</span>`;

      }
    );


    return html;

  }).join("");

}


function setBody(element,text) {

  element.dataset.raw = text;

  element.innerHTML = md(text);

}


/* ==========================================
   NOTIFICATIONS
========================================== */

function flash(message) {

  hintEl.textContent = message;

  clearTimeout(hintTimer);

  hintTimer = setTimeout(() => {

    hintEl.textContent = "";

  },4000);

}


/* ==========================================
   VOICE
========================================== */

function speak(text) {

  if (!("speechSynthesis" in window)) {

    flash("Voice reading is not supported in this browser.");
    return;

  }

  speechSynthesis.cancel();

  speechSynthesis.speak(
    new SpeechSynthesisUtterance(text)
  );

}


/* ==========================================
   BUTTON CREATION
========================================== */

function actionButton(label,onClick) {

  const button = document.createElement("button");

  button.type = "button";

  button.textContent = label;

  button.addEventListener("click",() => onClick(button));

  return button;

}


/* ==========================================
   MESSAGE DISPLAY
========================================== */

function addMessage(role,text,images,note) {

  const row = document.createElement("div");

  row.className = "row " + role;


  const avatar = document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent = role === "user" ? "You" : "M";


  const col = document.createElement("div");

  col.className = "col";


  const bubble = document.createElement("div");

  bubble.className = "bubble";


  // Display attached images.

  if (images && images.length) {

    const group = document.createElement("div");

    group.className = "thumbs";

    images.forEach(src => {

      const image = new Image();

      image.src = src;

      image.alt = "Attached image";

      group.append(image);

    });

    bubble.append(group);

  }


  if (note) {

    const messageNote = document.createElement("div");

    messageNote.className = "note";

    messageNote.textContent = note;

    bubble.append(messageNote);

  }


  const body = document.createElement("div");

  setBody(body,text);

  bubble.append(body);

  col.append(bubble);


  // Assistant actions.

  if (role === "assistant") {

    const actions = document.createElement("div");

    actions.className = "actions";


    actions.append(

      actionButton("Copy",async button => {

        try {

          await navigator.clipboard.writeText(
            body.dataset.raw || ""
          );

          button.textContent = "Copied";

        } catch(error) {

          button.textContent = "Can't copy";

        }

        setTimeout(() => {

          button.textContent = "Copy";

        },1500);

      }),

      actionButton("Read aloud",() => {

        speak(body.dataset.raw || "");

      })

    );


    col.append(actions);

  }


  row.append(avatar,col);

  log.append(row);

  log.scrollTop = log.scrollHeight;

  return {body,bubble};

}


/* ==========================================
   RENDER CHAT
========================================== */

function renderChat() {

  log.textContent = "";

  $("#title").textContent = assistant.name;


  addMessage(
    "assistant",
    assistant.greeting
  );


  chat.messages.forEach(message => {

    const lost =
      message.imgs &&
      !(message.images && message.images.length);

    addMessage(

      message.role,

      message.text,

      message.images,

      lost
        ? "🖼 " + message.imgs + " image(s) not saved"
        : ""

    );

  });

}


/* ==========================================
   DRAWER
========================================== */

function openDrawer(open) {

  drawer.classList.toggle("open",open);

  scrim.classList.toggle("open",open);

  $("#menu").setAttribute(
    "aria-expanded",
    String(open)
  );

  if (open) renderDrawer();

}


function renderDrawer() {

  const box = $("#assistants");

  box.textContent = "";


  ASSISTANTS.forEach(a => {

    const item = document.createElement("div");

    item.className = "item";


    const button = document.createElement("button");

    button.type = "button";

    button.textContent = a.icon + "  " + a.name;


    if (a.id === assistant.id) {

      button.setAttribute("aria-current","true");

    }


    button.addEventListener("click",() => {

      assistant = a;

      store.set("maynard.assistant",a.id);

      startNewChat();

    });


    item.append(button);

    box.append(item);

  });


  const recent = $("#recent");

  recent.textContent = "";


  if (!chats.length) {

    const empty = document.createElement("div");

    empty.className = "empty";

    empty.textContent = "No saved chats yet.";

    recent.append(empty);

  }


  chats.forEach(c => {

    const item = document.createElement("div");

    item.className = "item";


    const button = document.createElement("button");

    button.type = "button";

    button.textContent = c.title;


    if (c.id === chat.id) {

      button.setAttribute("aria-current","true");

    }


    button.addEventListener("click",() => {

      if (busy) {

        return flash("Wait for the reply to finish, or press Stop.");

      }


      chat = JSON.parse(JSON.stringify(c));

      assistant =
        ASSISTANTS.find(a => a.id === c.assistantId) ||
        ASSISTANTS[0];


      pending = [];

      renderChips();

      renderChat();

      openDrawer(false);

    });


    const del = document.createElement("button");

    del.type = "button";

    del.className = "del";

    del.textContent = "✕";

    del.setAttribute(
      "aria-label",
      "Delete chat " + c.title
    );


    del.addEventListener("click",() => {

      chats = chats.filter(x => x.id !== c.id);

      store.set("maynard.chats",chats);

      if (c.id === chat.id) {

        startNewChat();

      } else {

        renderDrawer();

      }

    });


    item.append(button,del);

    recent.append(item);

  });

}


/* ==========================================
   NEW CHAT
========================================== */

function startNewChat() {

  if (busy && controller) {

    controller.abort();

  }

  chat = newChat();

  pending = [];

  renderChips();

  renderChat();

  openDrawer(false);

}


/* ==========================================
   SAVE CHAT
========================================== */

function saveChat() {

  const slim = Object.assign({},chat,{

    messages:chat.messages.map(message => ({

      role:message.role,

      text:message.text,

      imgs:
        (message.images && message.images.length) ||
        message.imgs ||
        0

    }))

  });


  const index = chats.findIndex(
    c => c.id === chat.id
  );


  if (index >= 0) {

    chats[index] = slim;

  } else {

    chats.unshift(slim);

  }


  chats = chats.slice(0,30);

  store.set("maynard.chats",chats);

}


/* ==========================================
   IMAGE PROCESSING
========================================== */

async function toDataUrl(file) {

  const bitmap = await createImageBitmap(file);

  const scale = Math.min(
    1,
    1568 / Math.max(bitmap.width,bitmap.height)
  );


  const canvas = document.createElement("canvas");

  canvas.width = Math.round(bitmap.width * scale);

  canvas.height = Math.round(bitmap.height * scale);


  const context = canvas.getContext("2d");

  context.fillStyle = "#fff";

  context.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  context.drawImage(
    bitmap,
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (bitmap.close) bitmap.close();


  return canvas.toDataURL("image/jpeg",0.85);

}


async function addFiles(files) {

  for (const file of files) {

    if (!file.type.startsWith("image/")) {

      flash("Only image files can be attached.");

      continue;

    }


    if (pending.length >= MAX_IMAGES) {

      flash("You can attach up to " + MAX_IMAGES + " images.");

      break;

    }


    try {

      pending.push(await toDataUrl(file));

    } catch(error) {

      flash("Couldn't read " + file.name + ".");

    }

  }


  renderChips();

}


/* ==========================================
   IMAGE PREVIEW
========================================== */

function renderChips() {

  chipsEl.textContent = "";


  pending.forEach((src,index) => {

    const wrapper = document.createElement("div");

    wrapper.className = "chip";


    const image = new Image();

    image.src = src;

    image.alt = "Attached image " + (index + 1);


    const remove = document.createElement("button");

    remove.type = "button";

    remove.textContent = "✕";

    remove.setAttribute(
      "aria-label",
      "Remove image " + (index + 1)
    );


    remove.addEventListener("click",() => {

      pending.splice(index,1);

      renderChips();

    });


    wrapper.append(image,remove);

    chipsEl.append(wrapper);

  });

}


/* ==========================================
   API MESSAGE PREPARATION
========================================== */

function apiMessages() {

  return chat.messages.map(message => {

    const content = [];


    (message.images || []).forEach(src => {

      const parts = src.split(",");

      content.push({

        type:"image",

        source:{

          type:"base64",

          media_type:parts[0].slice(
            5,
            parts[0].indexOf(";")
          ),

          data:parts[1]

        }

      });

    });


    if (
      message.imgs &&
      !(message.images && message.images.length)
    ) {

      content.push({

        type:"text",

        text:
          "[Earlier, the user attached " +
          message.imgs +
          " image(s) that are no longer available.]"

      });

    }


    if (message.text) {

      content.push({

        type:"text",

        text:message.text

      });

    }


    return {

      role:message.role,

      content

    };

  });

}


/* ==========================================
   SYSTEM INSTRUCTIONS
========================================== */

function getSystemPrompt() {

  return assistant.system + `

ADDITIONAL RESPONSE RULES:

- Be accurate and helpful.
- Organize long answers clearly.
- Use readable Markdown.
- Use headings when appropriate.
- Avoid unnecessary repetition.
- Explain important steps.

MATHEMATICAL NOTATION:

- Use standard Unicode mathematical symbols.
- Use x², x³, xⁿ for powers.
- Use √ for square roots.
- Use × and ÷ for multiplication and division.
- Use π, θ, α and β where appropriate.
- Use ≤, ≥, ≠ and ≈ where appropriate.
- Use readable fractions such as (a + b)/(c + d).
- Put important equations between $$ and $$.
- Put every calculation step on a separate line.
- Avoid unnecessary LaTeX commands.
- Explain mathematical operations clearly.
- Check final answers whenever possible.

Today's date is ${new Date().toDateString()}.
`;

}


/* ==========================================
   STREAMING API
========================================== */

async function streamReply(messages,onText,signal) {

  const system = getSystemPrompt();


  // Use the existing Groq/backend integration
  // when no personal Anthropic key is supplied.

  const response = !settings.key

    ? await fetch("/api/chat",{

        method:"POST",

        signal,

        headers:{

          "content-type":"application/json"

        },

        body:JSON.stringify({

          messages,

          system

        })

      })


    // Optional direct Anthropic connection.

    : await fetch(API_URL,{

        method:"POST",

        signal,

        headers:{

          "content-type":"application/json",

          "x-api-key":settings.key,

          "anthropic-version":"2023-06-01",

          "anthropic-dangerous-direct-browser-access":"true"

        },

        body:JSON.stringify({

          model:settings.model || DEFAULT_MODEL,

          max_tokens:4096,

          stream:true,

          system,

          messages

        })

      });


  if (!response.ok) {

    let message = "Request failed (" + response.status + ")";

    try {

      const data = await response.json();

      message =
        data.error?.message ||
        data.message ||
        message;

    } catch(error) {}

    throw new Error(message);

  }


  const reader = response.body.getReader();

  const decoder = new TextDecoder();

  let buffer = "";

  let output = "";


  for (;;) {

    const {done,value} = await reader.read();

    if (done) break;


    buffer += decoder.decode(
      value,
      {stream:true}
    );


    const lines = buffer.split("\n");

    buffer = lines.pop();


    for (const line of lines) {

      if (!line.startsWith("data:")) continue;


      const raw = line.slice(5).trim();

      if (!raw || raw === "[DONE]") continue;


      let event;

      try {

        event = JSON.parse(raw);

      } catch(error) {

        continue;

      }


      // Anthropic streaming.

      if (
        event.type === "content_block_delta" &&
        event.delta?.text
      ) {

        output += event.delta.text;

        onText(output);

      }


      // Groq/OpenAI-compatible streaming.

      if (event.choices?.[0]?.delta?.content) {

        const content =
          event.choices[0].delta.content;

        if (typeof content === "string") {

          output += content;

          onText(output);

        }

      }


      if (event.type === "error") {

        throw new Error(
          event.error?.message || "Stream error"
        );

      }

    }

  }


  return output;

}


/* ==========================================
   BUSY STATE
========================================== */

function setBusy(value) {

  busy = value;

  sendBtn.textContent = value
    ? "Stop ■"
    : "Send ➤";

}


/* ==========================================
   SEND MESSAGE
========================================== */

async function send() {

  if (busy) {

    if (controller) controller.abort();

    return;

  }


  const text = input.value.trim();


  if (!text && !pending.length) return;


  const message = {

    role:"user",

    text,

    images:pending.slice()

  };


  chat.messages.push(message);


  if (chat.title === "New chat") {

    chat.title = (text || "Image chat").slice(0,40);

  }


  addMessage(
    "user",
    text,
    message.images
  );


  input.value = "";

  input.style.height = "auto";

  pending = [];

  renderChips();


  const view = addMessage(
    "assistant",
    "Thinking..."
  );


  controller = new AbortController();

  setBusy(true);


  let output = "";


  try {

    await streamReply(

      apiMessages(),

      text => {

        output = text;

        setBody(view.body,text);

        log.scrollTop = log.scrollHeight;

      },

      controller.signal

    );


    if (!output.trim()) {

      view.body.textContent =
        "I couldn't generate a response. Please try again.";

    }


  } catch(error) {

    if (error.name !== "AbortError") {

      view.bubble.classList.add("error");


      if (!output) {

        view.body.textContent =
          "⚠️ " + error.message;

      } else {

        view.body.textContent +=
          "\n\n⚠️ " + error.message;

      }

    } else if (!output) {

      view.body.textContent = "Stopped.";

    }

  } finally {

    setBusy(false);

    controller = null;

  }


  if (output) {

    chat.messages.push({

      role:"assistant",

      text:output

    });


    if (autoSpeak) {

      speak(output);

    }

  }


  saveChat();

}


/* ==========================================
   SETTINGS
========================================== */

function openSettings() {

  openDrawer(false);

  $("#keyInput").value = settings.key;

  $("#modelInput").value = settings.model;

  dlg.showModal();

}


$("#openSettings").addEventListener(
  "click",
  openSettings
);


$("#saveSettings").addEventListener(
  "click",
  () => {

    settings = {

      key:$("#keyInput").value.trim(),

      model:
        $("#modelInput").value.trim() ||
        DEFAULT_MODEL

    };


    store.set(
      "maynard.settings",
      settings
    );


    dlg.close();

    flash("Settings saved.");

  }
);


$("#clearData").addEventListener(
  "click",
  () => {

    if (!confirm("Delete all saved chats?")) return;

    chats = [];

    store.set("maynard.chats",chats);

    dlg.close();

    startNewChat();

  }
);


/* ==========================================
   COMPOSER EVENTS
========================================== */

form.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    send();

  }
);


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      form.requestSubmit();

    }

  }
);


input.addEventListener(
  "input",
  () => {

    input.style.height = "auto";

    input.style.height =
      Math.min(input.scrollHeight,160) + "px";

  }
);


input.addEventListener(
  "paste",
  event => {

    const files = Array.from(
      event.clipboardData.files
    ).filter(file => file.type.startsWith("image/"));


    if (files.length) {

      event.preventDefault();

      addFiles(files);

    }

  }
);


/* ==========================================
   IMAGE ATTACHMENT EVENTS
========================================== */

$("#attach").addEventListener(
  "click",
  () => $("#file").click()
);


$("#file").addEventListener(
  "change",
  event => {

    addFiles(
      Array.from(event.target.files)
    );

    event.target.value = "";

  }
);


/* ==========================================
   MENU EVENTS
========================================== */

$("#menu").addEventListener(
  "click",
  () => {

    openDrawer(
      !drawer.classList.contains("open")
    );

  }
);


scrim.addEventListener(
  "click",
  () => openDrawer(false)
);


document.addEventListener(
  "keydown",
  event => {

    if (event.key === "Escape") {

      openDrawer(false);

    }

  }
);


$("#newChat").addEventListener(
  "click",
  startNewChat
);


/* ==========================================
   VOICE EVENTS
========================================== */

voiceBtn.addEventListener(
  "click",
  () => {

    autoSpeak = !autoSpeak;

    voiceBtn.setAttribute(
      "aria-pressed",
      String(autoSpeak)
    );


    if (
      !autoSpeak &&
      "speechSynthesis" in window
    ) {

      speechSynthesis.cancel();

    }

  }
);


/* ==========================================
   SPEECH RECOGNITION
========================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  micBtn.disabled = true;

  micBtn.title =
    "Dictation is not supported in this browser.";

} else {

  const recognition = new SpeechRecognition();

  recognition.interimResults = false;

  recognition.continuous = false;


  recognition.onresult = event => {

    const transcript =
      event.results[0][0].transcript;


    input.value +=
      (input.value ? " " : "") +
      transcript;


    input.focus();

    input.dispatchEvent(
      new Event("input")
    );

  };


  recognition.onerror = () => {

    flash("Voice recognition could not complete.");

  };


  recognition.onend = () => {

    micBtn.classList.remove("on");

  };


  micBtn.addEventListener(
    "click",
    () => {

      if (micBtn.classList.contains("on")) {

        recognition.stop();

        return;

      }


      try {

        micBtn.classList.add("on");

        recognition.start();

      } catch(error) {

        micBtn.classList.remove("on");

        flash("Voice recognition is unavailable.");

      }

    }
  );

}


/* ==========================================
   INITIALIZE APPLICATION
========================================== */

chat = newChat();

renderChat();

})();
</script>

</body>
</html>
