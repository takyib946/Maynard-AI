
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d1b">
<title>Maynard AI</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)'], ['$','$']],
    displayMath: [['\\[', '\\]'], ['$$', '$$']],
    processEscapes: true,
    processEnvironments: true,
    packages: {'[+]':['ams']}
  },
  options: {
    skipHtmlTags: ['script','noscript','style','textarea','pre','code']
  },
  chtml: {scale:1.05,matchFontHeight:false},
  startup: {typeset:false}
};
</script>

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
:root {
  --bg:#080c19;
  --panel:rgba(17,25,48,.88);
  --line:rgba(160,180,255,.15);
  --text:#f4f6ff;
  --muted:#a5afca;
  --accent:#8b7cff;
  --accent2:#35d6cf;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,system-ui,Arial,sans-serif;
  background:
    radial-gradient(ellipse at 15% 15%,rgba(103,80,255,.22),transparent 38%),
    radial-gradient(ellipse at 85% 80%,rgba(20,205,194,.13),transparent 36%),
    linear-gradient(135deg,#080c19,#10162b 55%,#090e1d);
  background-attachment:fixed;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
  width:265px;flex-shrink:0;padding:20px 15px;
  background:rgba(7,11,25,.92);
  border-right:1px solid var(--line);
  backdrop-filter:blur(22px);
  display:flex;flex-direction:column;gap:17px;z-index:10;
}
.brand{display:flex;align-items:center;gap:11px;padding:8px 7px 17px}
.logo,.welcome-logo{
  display:grid;place-items:center;font-weight:900;color:white;
  background:linear-gradient(135deg,#8b7cff,#30d7cc);
  box-shadow:0 8px 28px #7564ff55;
}
.logo{width:42px;height:42px;border-radius:14px}
.brand strong{font-size:19px}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.newchat,.mode,.sidebtn{
  width:100%;border:1px solid var(--line);border-radius:13px;
  background:rgba(255,255,255,.045);color:var(--text);
  padding:12px;text-align:left;transition:.2s;
}
.newchat{
  background:linear-gradient(120deg,#6e5de4,#397cce);
  border:0;text-align:center;font-weight:700;
}
.section{
  color:#7f8ba9;font-size:10px;font-weight:800;
  letter-spacing:1.4px;padding:3px 10px;
}
.modes{display:grid;gap:3px}
.mode{border-color:transparent;color:#c1c9df;padding:10px 12px}
.mode:hover,.mode.active,.sidebtn:hover{
  background:rgba(135,123,255,.16);
  border-color:#8b7cff55;color:white;
}
.history-section{display:flex;flex-direction:column;min-height:0;max-height:36vh}
.history-list{display:grid;gap:6px;overflow-y:auto;padding:3px}
.history-empty{color:var(--muted);font-size:12px;padding:8px}
.history-item{
  display:flex;align-items:center;gap:4px;
  border:1px solid transparent;border-radius:10px;
  padding:6px;background:#ffffff08;
}
.history-item.active{background:rgba(139,124,255,.17);border-color:#8b7cff55}
.history-open{
  flex:1;min-width:0;border:0;background:transparent;color:#dce3fa;
  text-align:left;font-size:12px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;padding:7px 4px;
}
.history-action{border:0;background:transparent;color:#aeb9d8;padding:5px;font-size:12px}
.history-action:hover{color:white}
.sidebottom{margin-top:auto;display:grid;gap:8px}
.sidebtn{font-size:13px}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{
  height:68px;display:flex;align-items:center;justify-content:space-between;
  padding:0 25px;border-bottom:1px solid var(--line);
  background:rgba(8,12,25,.55);backdrop-filter:blur(18px);
  position:sticky;top:0;z-index:5;
}
.top-left{display:flex;align-items:center;gap:12px}
.topbar h2{font-size:15px;margin:0}
.top-actions{display:flex;gap:8px}
.iconbtn{
  border:1px solid var(--line);background:#ffffff08;color:#e8ebff;
  border-radius:10px;min-width:38px;height:38px;padding:0 10px;
}
.menu-button{display:none}

/* CHAT */
.chat{width:min(900px,100%);margin:0 auto;padding:28px 22px 220px;flex:1}
.welcome{text-align:center;padding:clamp(40px,10vh,105px) 12px 45px}
.welcome-logo{
  width:68px;height:68px;border-radius:23px;margin:0 auto 20px;font-size:26px;
}
.welcome h1{font-size:clamp(27px,5vw,42px);margin:0 0 12px;letter-spacing:-1px}
.gradient{
  background:linear-gradient(90deg,#b3aaff,#53e5d8);
  background-clip:text;color:transparent;
}
.welcome p{color:var(--muted);max-width:520px;margin:0 auto;line-height:1.7;font-size:14px}
.suggestions{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;max-width:650px;margin:28px auto 0;
}
.suggestion{
  border:1px solid var(--line);border-radius:15px;
  background:rgba(255,255,255,.045);color:#e5e9ff;
  text-align:left;padding:15px;line-height:1.5;font-size:13px;
}
.suggestion:hover{border-color:#8b7cff88;background:#8174ff16}

/* MESSAGES */
.message{display:flex;margin:22px 0;gap:10px;align-items:flex-start;animation:appear .25s ease}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.message.user{justify-content:flex-end}
.avatar{
  width:32px;height:32px;border-radius:11px;flex:0 0 32px;
  display:grid;place-items:center;font-size:11px;font-weight:800;
  background:linear-gradient(135deg,#8b7cff,#35d6cf);color:white;
}
.message.user .avatar{order:2;background:linear-gradient(135deg,#397cce,#7564e8)}
.message-body{min-width:0;max-width:min(82%,720px)}
.bubble{
  padding:13px 16px;border:1px solid var(--line);
  border-radius:17px;background:rgba(24,34,59,.96);
  line-height:1.72;font-size:14px;min-width:0;max-width:100%;
  overflow-wrap:break-word;word-break:normal;hyphens:manual;
  box-shadow:0 8px 25px #00000018;
}
.message.user .bubble{
  background:linear-gradient(135deg,#6658dc,#397fdb);
  border-color:#ffffff20;border-radius:17px 5px 17px 17px;
}
.message.assistant .bubble{border-radius:5px 17px 17px 17px}
.bubble p{margin:0 0 11px}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3{line-height:1.3;margin:17px 0 8px}
.bubble ul,.bubble ol{padding-left:23px}
.bubble li{margin:5px 0}
.bubble pre{
  white-space:pre-wrap;overflow:auto;overflow-wrap:anywhere;
  background:#080d1c;padding:13px;border-radius:10px;
  border:1px solid var(--line);max-width:100%;
}
.bubble code{background:#ffffff12;padding:2px 5px;border-radius:5px;overflow-wrap:anywhere}
.bubble pre code{background:none;padding:0}
.bubble blockquote{border-left:3px solid var(--accent);margin:10px 0;padding:5px 12px;color:#c6cce2}
.bubble table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;margin:12px 0;max-width:100%}
.bubble th,.bubble td{border:1px solid var(--line);padding:9px;text-align:left}
.bubble th{background:#ffffff12}

/* MATHEMATICS */
.bubble mjx-container{color:#f0efff!important;max-width:100%;overflow-x:auto;overflow-y:hidden}
.bubble mjx-container[display="true"]{
  display:block;margin:17px 0!important;padding:15px 10px;
  background:linear-gradient(120deg,rgba(139,124,255,.09),rgba(53,214,207,.05));
  border:1px solid rgba(160,180,255,.15);border-radius:13px;text-align:center;
}
.bubble mjx-math{font-size:1.04em}
.message.user .bubble mjx-container{color:white!important}

/* IMAGE GALLERY */
.image-gallery{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:9px;margin-top:12px;max-width:100%;
}
.image-card{min-width:0}
.uploaded-image{
  display:block;width:100%;height:150px;max-width:100%;
  object-fit:cover;border-radius:12px;
  border:1px solid #ffffff25;background:#080d1c;
}
.image-caption{font-size:11px;color:#cbd4ef;margin-top:4px;overflow-wrap:anywhere}
.image-download{
  display:inline-block;margin-top:6px;padding:6px 10px;
  border:1px solid var(--line);border-radius:8px;
  color:#dcd8ff;text-decoration:none;font-size:11px;
  background:#ffffff0b;
}
.image-download:hover{background:#ffffff18}
.message-tools{display:flex;gap:7px;margin-top:8px;opacity:.85}
.tool{border:0;background:transparent;color:#aeb9d8;font-size:11px;padding:4px}
.tool:hover{color:white}

/* IMAGE VIEWER */
.image-viewer{
  position:fixed;inset:0;z-index:9999;display:flex;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.96);padding:65px 15px 75px;
  overflow:auto;touch-action:pan-x pan-y;
}
.image-viewer.hidden{display:none!important}
.image-viewer img{
  display:block;max-width:100%;max-height:100%;
  width:auto;height:auto;object-fit:contain;
  transform:scale(1);transform-origin:center;transition:transform .2s ease;
}
.image-viewer-close,.image-viewer-zoom{
  position:fixed;z-index:10000;border:1px solid #ffffff35;
  background:#222b45;color:white;border-radius:50%;
  width:44px;height:44px;font-size:25px;display:grid;place-items:center;
}
.image-viewer-close{top:15px;right:15px}
.image-viewer-zoom{bottom:20px}
#zoomOutImage{right:75px}
#zoomInImage{right:20px}

/* TYPING */
.typing{display:flex;gap:5px;padding:6px}
.typing i{width:6px;height:6px;border-radius:50%;background:#aaa2ff;animation:bounce .8s infinite alternate}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
.hidden{display:none!important}
@keyframes bounce{to{transform:translateY(-5px);opacity:.4}}

/* COMPOSER */
.composer-wrap{
  position:fixed;bottom:0;left:265px;right:0;
  padding:18px 22px 17px;
  background:linear-gradient(transparent,rgba(8,12,25,.96) 25%);
  backdrop-filter:blur(10px);z-index:4;
}
.composer{
  width:min(1100px,100%);margin:auto;
  border:1px solid #9d9aff55;
  background:rgba(20,28,52,.96);
  border-radius:19px;padding:13px;
  box-shadow:0 12px 45px #0006,0 0 25px #7564ff16;
}

/* ATTACHMENTS */
.attachments{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:10px;padding:4px 2px 10px;max-height:220px;overflow-y:auto;
}
.attachment-item{
  position:relative;min-width:0;display:flex;flex-direction:column;gap:4px;
  background:#ffffff0b;border:1px solid var(--line);border-radius:12px;overflow:hidden;
}
.attachment-thumb{width:100%;height:88px;object-fit:cover;display:block;background:#080d1c}
.attachment-name{
  font-size:10px;color:#d4dcf7;padding:2px 7px 7px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.attachment-remove{
  position:absolute;top:5px;right:5px;width:25px;height:25px;
  border:0;border-radius:50%;background:#171a2bdc;color:#ffaaaa;
  font-size:17px;display:grid;place-items:center;
}
.attachment-remove:hover{background:#a52c45;color:white}
.attachment-document{padding:14px 8px;font-size:11px;color:#d4dcf7;overflow-wrap:anywhere;min-height:65px}

/* IMAGE GENERATION */
.image-gen-controls{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:5px 3px 10px;color:var(--muted);font-size:11px;
}
.image-gen-controls select{
  background:#10182e;color:#edf0ff;border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;outline:none;
}
.image-gen-btn{
  border:1px solid #8b7cff66;
  background:linear-gradient(135deg,#6959dc,#287f9b);
  color:white;font-size:12px;font-weight:700;white-space:nowrap;
}
.image-gen-btn:disabled{opacity:.5;cursor:not-allowed}
.image-gen-status{font-size:11px;color:var(--muted)}

/* INPUT */
.compose-row{display:flex;flex-direction:column;align-items:stretch;gap:10px;width:100%}
.compose-row textarea{
  display:block;width:100%;min-width:0;min-height:72px;max-height:200px;
  resize:none;background:rgba(255,255,255,.025);
  border:1px solid var(--line);border-radius:12px;
  outline:none;color:white;padding:14px;font-size:15px;
  line-height:1.6;overflow-y:auto;
}
.compose-row textarea:focus{border-color:#8b7cff99;box-shadow:0 0 0 2px #8b7cff18}
.compose-row textarea::placeholder{color:#8793b2}
.compose-actions{display:flex;align-items:center;gap:9px;width:100%;flex-wrap:wrap}
.compose-actions .actionbtn{flex-shrink:0}
.compose-actions .sendbtn{margin-left:auto;flex-shrink:0}
.actionbtn{
  min-width:38px;height:38px;border-radius:11px;
  border:1px solid var(--line);background:#ffffff0b;color:#e9edff;padding:0 10px;
}
.sendbtn{
  background:linear-gradient(135deg,#8b7cff,#397cce);border:0;
  font-weight:700;border-radius:11px;padding:0 16px;height:38px;color:white;
}
.sendbtn:disabled{opacity:.5;cursor:not-allowed}
.status{text-align:center;font-size:11px;color:var(--muted);margin-top:10px}

/* MOBILE */
@media(max-width:760px){
  .sidebar{
    position:fixed;top:0;bottom:0;left:-280px;transition:left .25s;
    box-shadow:10px 0 30px #0006;overflow-y:auto;
  }
  .sidebar.open{left:0}
  .menu-button{display:inline-block}
  .topbar{padding:0 12px}
  .chat{padding:18px 12px 245px}
  .bubble{padding:12px}
  .message-body{max-width:88%}
  .composer-wrap{left:0;right:0;padding:10px}
  .suggestions{grid-template-columns:1fr}
  .bubble mjx-container[display="true"]{padding:10px 5px;margin:12px 0!important}
  .bubble mjx-math{font-size:1em}
  .sendbtn{padding:0 11px;font-size:12px}
  .history-section{max-height:30vh}
  .attachments{grid-template-columns:repeat(auto-fill,minmax(85px,1fr));max-height:180px}
  .attachment-thumb{height:75px}
  .compose-row{gap:9px}
  .compose-row textarea{width:100%;min-height:72px;font-size:15px}
  .compose-actions{gap:7px}
  .image-gen-btn{padding:0 7px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">M</div>
    <div><strong>Maynard AI</strong><small>Your intelligent assistant</small></div>
  </div>

  <button class="newchat" id="newChat">＋ New conversation</button>

  <div>
    <div class="section">ASSISTANT MODES</div>
    <div class="modes" id="modes">
      <button class="mode active" data-mode="general">🌐 General</button>
      <button class="mode" data-mode="education">🎓 Education</button>
      <button class="mode" data-mode="writing">✍️ Writing</button>
      <button class="mode" data-mode="coding">💻 Coding</button>
      <button class="mode" data-mode="research">🔎 Research</button>
      <button class="mode" data-mode="business">💼 Business</button>
      <button class="mode" data-mode="creative">🎨 Creative</button>
      <button class="mode" data-mode="translator">🌍 Translator</button>
      <button class="mode" data-mode="summarizer">📄 Summarizer</button>
    </div>
  </div>

  <div class="history-section">
    <div class="section">CHAT HISTORY</div>
    <div id="historyList" class="history-list">
      <p class="history-empty">No conversations yet.</p>
    </div>
  </div>

  <div class="sidebottom">
    <button class="sidebtn" id="exportBtn">⬇ Export conversation</button>
    <button class="sidebtn" id="clearBtn">🗑 Clear conversation</button>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <div class="top-left">
      <button class="iconbtn menu-button" id="menuBtn" aria-label="Open menu">☰</button>
      <h2 id="modeTitle">General Assistant</h2>
    </div>
    <div class="top-actions">
      <button class="iconbtn" id="voiceToggle">🔊 Voice</button>
    </div>
  </header>

  <section class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-logo">M</div>
      <h1>Welcome to <span class="gradient">Maynard AI</span></h1>
      <p>Your intelligent multipurpose assistant. Ask questions, learn, write, code, translate and explore ideas.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Explain quadratic equations step by step with examples.">🎓 <strong>Learn something</strong><br>Understand a difficult topic.</button>
        <button class="suggestion" data-prompt="Help me write a professional letter.">✍️ <strong>Write something</strong><br>Create polished writing.</button>
        <button class="suggestion" data-prompt="Help me build a simple website using HTML, CSS and JavaScript.">💻 <strong>Build something</strong><br>Get help with coding.</button>
        <button class="suggestion" data-prompt="Give me five creative ideas for a new project.">💡 <strong>Explore ideas</strong><br>Discover creative possibilities.</button>
      </div>
    </div>
    <div id="messages"></div>
  </section>

  <div class="composer-wrap">
    <div class="composer">
      <div class="attachments" id="attachmentList"></div>

      <div class="image-gen-controls">
        <label for="imageAspectRatio">Image size:</label>
        <select id="imageAspectRatio">
          <option value="1:1">Square 1:1</option>
          <option value="16:9">Landscape 16:9</option>
          <option value="9:16">Portrait 9:16</option>
          <option value="4:5">Portrait 4:5</option>
          <option value="3:2">Landscape 3:2</option>
          <option value="2:3">Portrait 2:3</option>
          <option value="5:4">Landscape 5:4</option>
          <option value="21:9">Wide 21:9</option>
          <option value="9:21">Tall 9:21</option>
        </select>
        <span id="imageGenStatus" class="image-gen-status" aria-live="polite"></span>
      </div>

      <div class="compose-row">
        <textarea id="messageInput" rows="2" placeholder="Write your prompt..." aria-label="Write your message"></textarea>

        <div class="compose-actions">
          <button class="actionbtn" id="attachBtn" title="Choose images">🖼</button>
          <button class="actionbtn" id="docBtn" title="Attach document">📄</button>
          <button class="actionbtn" id="micBtn" title="Voice input">🎙</button>
          <button class="actionbtn image-gen-btn" id="imageGenBtn" type="button" title="Generate an image">🎨 Create</button>
          <button class="sendbtn" id="sendBtn">Send ➤</button>

          <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
          <input type="file" id="documentInput" accept=".txt,.md,.csv,.tsv" multiple hidden>
        </div>
      </div>
    </div>
    <div class="status">Maynard AI can make mistakes. Check important answers.</div>
  </div>
</main>
</div>

<div id="imageViewer" class="image-viewer hidden">
  <button id="closeImageViewer" class="image-viewer-close" aria-label="Close image">×</button>
  <button id="zoomOutImage" class="image-viewer-zoom" aria-label="Zoom out">−</button>
  <button id="zoomInImage" class="image-viewer-zoom" aria-label="Zoom in">+</button>
  <img id="fullScreenImage" alt="Picture">
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const chat = $("messages");
const messageInput = $("messageInput");
const sendBtn = $("sendBtn");
const attachmentList = $("attachmentList");
const imageInput = $("imageInput");
const documentInput = $("documentInput");
const imageGenBtn = $("imageGenBtn");
const imageAspectRatio = $("imageAspectRatio");
const imageGenStatus = $("imageGenStatus");

const MAX_IMAGES_PER_MESSAGE = 15;
const MAX_DOCUMENTS_PER_MESSAGE = 5;
const MAX_FILE_SIZE = 12 * 1024 * 1024;
const MAX_DOCUMENT_CHARS = 20000;

const modeNames = {
  general:"General Assistant",
  education:"Education Assistant",
  writing:"Writing Assistant",
  coding:"Coding Assistant",
  research:"Research Assistant",
  business:"Business Assistant",
  creative:"Creative Assistant",
  translator:"Translator",
  summarizer:"Summarizer"
};

let currentMode = "general";
let conversation = [];
let attachments = [];
let savedChats = [];
let currentChatId = null;
let busy = false;
let imageGenBusy = false;
let voiceEnabled = false;
let mathReady = false;
let mathQueue = Promise.resolve();

/* IMAGE VIEWER */

let imageZoom = 1;

function openImageViewer(src) {
  if (!src) return;
  const viewer = $("imageViewer");
  const fullImage = $("fullScreenImage");
  imageZoom = 1;
  fullImage.src = src;
  fullImage.style.transform = "scale(1)";
  viewer.classList.remove("hidden");
  document.body.style.overflow = "hidden";
}

function closeImageViewer() {
  $("imageViewer").classList.add("hidden");
  $("fullScreenImage").src = "";
  document.body.style.overflow = "";
  imageZoom = 1;
}

$("closeImageViewer").onclick = closeImageViewer;

$("imageViewer").onclick = event => {
  if (event.target === $("imageViewer")) closeImageViewer();
};

$("zoomInImage").onclick = () => {
  imageZoom = Math.min(imageZoom + .25,3);
  $("fullScreenImage").style.transform = `scale(${imageZoom})`;
};

$("zoomOutImage").onclick = () => {
  imageZoom = Math.max(imageZoom - .25,.5);
  $("fullScreenImage").style.transform = `scale(${imageZoom})`;
};

document.addEventListener("keydown",event => {

/* INDEXEDDB IMAGE STORAGE */

const IMAGE_DB_NAME = "MaynardAI_ImageDatabase";
const IMAGE_STORE_NAME = "chatImages";
let imageDatabasePromise = null;

function openImageDatabase() {
  if (imageDatabasePromise) return imageDatabasePromise;

  imageDatabasePromise = new Promise((resolve,reject) => {
    if (!("indexedDB" in window)) {
      reject(new Error("This browser does not support image storage."));
      return;
    }

    const request = indexedDB.open(IMAGE_DB_NAME,1);

    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(IMAGE_STORE_NAME)) {
        db.createObjectStore(IMAGE_STORE_NAME,{keyPath:"id"});
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => {
      imageDatabasePromise = null;
      reject(request.error);
    };
  });

  return imageDatabasePromise;
}

async function saveChatImage(image) {
  const db = await openImageDatabase();
  return new Promise((resolve,reject) => {
    const transaction = db.transaction(IMAGE_STORE_NAME,"readwrite");
    transaction.objectStore(IMAGE_STORE_NAME).put(image);
    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error);
  });
}

async function getChatImage(id) {
  const db = await openImageDatabase();
  return new Promise((resolve,reject) => {
    const transaction = db.transaction(IMAGE_STORE_NAME,"readonly");
    const request = transaction.objectStore(IMAGE_STORE_NAME).get(id);
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error);
  });
}

async function deleteChatImage(id) {
  const db = await openImageDatabase();
  return new Promise((resolve,reject) => {
    const transaction = db.transaction(IMAGE_STORE_NAME,"readwrite");
    transaction.objectStore(IMAGE_STORE_NAME).delete(id);
    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error);
  });
}

async function deleteImagesForMessages(messages) {
  const ids = (messages || []).flatMap(message =>
    (message.images || []).map(image => image.id).filter(Boolean)
  );
  await Promise.allSettled(ids.map(deleteChatImage));
}

/* MARKDOWN AND MATHEMATICS */

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g,c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[c]);
}

function removeBoxedLatex(source) {
  let text = String(source);
  let searchFrom = 0;

  while (true) {
    const start = text.indexOf("\\boxed",searchFrom);
    if (start === -1) break;

    const open = text.indexOf("{",start + 6);
    if (open === -1) break;

    let depth = 1;
    let end = open + 1;

    while (end < text.length && depth > 0) {
      if (text[end] === "{") depth++;
      if (text[end] === "}") depth--;
      end++;
    }

    if (depth !== 0) {
      searchFrom = open + 1;
      continue;
    }

    const inside = text.slice(open + 1,end - 1);
    text = text.slice(0,start) + inside + text.slice(end);
    searchFrom = start + inside.length;
  }

  return text.replace(/\\fbox\s*\{([^{}]*)\}/g,"$1");
}

function normalizeMathSource(source) {
  let text = removeBoxedLatex(source);

  const environments = [
    "aligned","alignedat","gathered","cases","array","matrix",
    "pmatrix","bmatrix","Bmatrix","vmatrix","Vmatrix",
    "equation","equation*","align","align*","gather","gather*"
  ];

  const hasMathDelimiters = text.includes("\\[") || text.includes("$$");

  if (!hasMathDelimiters) {
    const names = environments.join("|");
    const pattern = new RegExp(
      "\\\\begin\\{(" + names + ")\\}[\\s\\S]*?\\\\end\\{\\1\\}","g"
    );

    text = text.replace(pattern,match => "\\[\n" + match + "\n\\]");
  }

  return text;
}

function protectMath(source) {
  const saved = [];
  let text = normalizeMathSource(source);

  const patterns = [
    /\$\$[\s\S]+?\$\$/g,
    /\\\[[\s\S]+?\\\]/g,
    /\\\([\s\S]+?\\\)/g,
    /(?<!\\)\$(?!\$)[^\n$]+(?<!\\)\$(?!\$)/g
  ];

  for (const pattern of patterns) {
    text = text.replace(pattern,match => {
      const token = `MATHPROTECTEDTOKEN${saved.length}END`;
      saved.push(match);
      return token;
    });
  }

  return {text,saved};
}

function restoreMathTokens(root,saved) {
  const walker = document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes = [];

  while (walker.nextNode()) nodes.push(walker.currentNode);

  for (const node of nodes) {
    let value = node.nodeValue;
    let changed = false;

    saved.forEach((math,index) => {
      const token = `MATHPROTECTEDTOKEN${index}END`;

      if (value.includes(token)) {
        value = value.split(token).join(math);
        changed = true;
      }
    });

    if (changed) node.nodeValue = value;
  }
}

function formatMarkdown(source) {
  const protectedContent = protectMath(source);
  let html;

  if (window.marked && window.DOMPurify) {
    html = window.marked.parse(protectedContent.text,{breaks:true,gfm:true});
    html = window.DOMPurify.sanitize(html);
  } else {
    html = escapeHTML(protectedContent.text).replace(/\n/g,"<br>");
  }

  const container = document.createElement("div");
  container.innerHTML = html;
  restoreMathTokens(container,protectedContent.saved);

  return container.innerHTML;
}

function renderMath(element) {
  if (!mathReady || !window.MathJax || !MathJax.typesetPromise) return;

  mathQueue = mathQueue.then(async () => {
    try {
      MathJax.typesetClear([element]);
      await MathJax.typesetPromise([element]);
    } catch(error) {
      console.warn("Math rendering error:",error);
    }
  });
}

/* IMAGE RESIZING */

function resizeImage(file) {
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read the picture."));

    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("This picture could not be opened."));

      img.onload = () => {
        const max = 1280;
        const scale = Math.min(1,max / Math.max(img.width,img.height));

        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);

        const context = canvas.getContext("2d");

        if (!context) {
          reject(new Error("Image processing is unavailable."));
          return;
        }

        context.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",.75));
      };

      img.src = reader.result;
    };

    reader.readAsDataURL(file);
  });
}

async function processAttachments(files,imageOnly) {
  for (const file of Array.from(files || [])) {
    const isImage = file.type.startsWith("image/");
    const isDocument = /\.(txt|md|csv|tsv)$/i.test(file.name);

    if (imageOnly && !isImage) continue;

    if (!imageOnly && !isDocument) {
      alert("Please choose a TXT, MD, CSV or TSV file.");
      continue;
    }

    if (isImage) {
      const imageCount = attachments.filter(item => item.type.startsWith("image/")).length;

      if (imageCount >= MAX_IMAGES_PER_MESSAGE) {
        alert("You can attach up to 15 pictures in one message.");
        break;
      }

    } else {
      const documentCount = attachments.filter(item => !item.type.startsWith("image/")).length;

      if (documentCount >= MAX_DOCUMENTS_PER_MESSAGE) {
        alert("You can attach up to five documents.");
        break;
      }
    }

    if (file.size > MAX_FILE_SIZE) {
      alert("Each file must be smaller than 12 MB.");
      continue;
    }

    try {
      const data = isImage
        ? await resizeImage(file)
        : (await file.text()).slice(0,MAX_DOCUMENT_CHARS);

      attachments.push({
        name:file.name,
        type:isImage ? "image/jpeg" : "text/plain",
        data
      });

      updateAttachmentList();

    } catch(error) {
      console.error(error);
      alert("Could not read " + file.name);
    }
  }
}

/* STREAMING RESPONSE */

function readStreamEvent(data,state) {
  if (!data || data === "[DONE]") return;

  let event;

  try {
    event = JSON.parse(data);
  } catch {
    return;
  }

  if (event.type === "error" || event.error) {
    state.error = event.error?.message || event.message ||
      "An error occurred while generating your answer.";
    return;
  }

  const text =
    event.delta?.text ||
    event.choices?.[0]?.delta?.content ||
    "";

  if (!text) return;

  state.reply += text;
  removeTyping();

  if (!state.row) {
    state.row = addMessage("assistant","");
  }

  const bubble = state.row.querySelector(".bubble");
  bubble.innerHTML = formatMarkdown(state.reply);
  window.scrollTo(0,document.body.scrollHeight);
}

  addMessage("user",prompt);
  messageInput.value = "";
  messageInput.style.height = "72px";
  saveHistory();

  try {
    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"generate_image",
        prompt,
        aspect_ratio:imageAspectRatio.value || "1:1"
      })
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      let message = result.message || result.error || "Image generation failed.";

      if (response.status === 401) {
        message = "The Stability AI API key was rejected. Check STABILITY_API_KEY in Vercel.";
      } else if (response.status === 402) {
        message = "Your Stability AI account may not have enough credits.";
      } else if (response.status === 403) {
        message = "The image request was not allowed by the image service.";
      } else if (response.status === 429) {
        message = "The image service is receiving too many requests. Please wait and try again.";
      }

      throw new Error(message);
    }

    if (
      typeof result.imageData !== "string" ||
      !result.imageData.startsWith("data:image/")
    ) {
      throw new Error("The image service returned an invalid image.");
    }

    const imageId = createImageId();
    const mimeType = result.mimeType || "image/png";

    const extension = mimeType.includes("jpeg")
      ? "jpg"
      : mimeType.includes("webp")
        ? "webp"
        : "png";

    const imageName = "Maynard-AI-generated-image." + extension;

    await saveChatImage({
      id:imageId,
      name:imageName,
      type:mimeType,
      data:result.imageData,
      createdAt:Date.now()
    });

    loadingRow.remove();

    const imageInfo = {id:imageId,name:imageName};

    conversation.push({
      role:"assistant",
      content:"Your image has been generated successfully.",
      displayContent:"Your image has been generated successfully.",
      images:[imageInfo]
    });

    addMessage(
      "assistant",
      "Your image has been generated successfully.",
      {images:[imageInfo]}
    );

    saveHistory();
    imageGenStatus.textContent = "Image created successfully.";

  } catch(error) {
    console.error("Stability AI generation error:",error);
    loadingRow.remove();

    const errorMessage =
      "**Image generation failed.**\n\n" +
      (error?.message || "An unexpected error occurred.");

    conversation.push({
      role:"assistant",
      content:errorMessage,
      displayContent:errorMessage,
      images:[]
    });

    addMessage("assistant",errorMessage);
    saveHistory();

    imageGenStatus.textContent = "Generation failed.";

  } finally {
    imageGenBusy = false;
    imageGenBtn.disabled = false;
    sendBtn.disabled = false;
    imageGenBtn.textContent = "🎨 Create";
  }
}

imageGenBtn.onclick = generateImage;

/* SEND MESSAGE */

async function sendMessage() {
  if (busy || imageGenBusy) return;

  const message = messageInput.value.trim();

  if (!message && !attachments.length) return;

  const currentAttachments = attachments.slice();
  attachments = [];
  updateAttachmentList();

  const displayText = message || "Please examine my attachment.";
  const messageImages = [];

  try {
    for (const file of currentAttachments) {
      if (!file.type.startsWith("image/")) continue;

      const imageId = createImageId();

      await saveChatImage({
        id:imageId,
        name:file.name,
        type:file.type,
        data:file.data,
        createdAt:Date.now()
      });

      messageImages.push({id:imageId,name:file.name});
    }

  } catch(error) {
    console.error("Image storage error:",error);
    alert("Maynard AI could not save the picture in your browser. Please try again.");
    attachments = currentAttachments;
    updateAttachmentList();
    return;
  }

  // Keep document contents in the conversation history.
  const textAttachments = currentAttachments.filter(
    file => !file.type.startsWith("image/")
  );

  let savedUserContent = displayText;

  for (const file of textAttachments) {
    savedUserContent +=
      "\n\nAttached document: " + file.name + "\n" + file.data;
  }

  conversation.push({
    role:"user",
    content:savedUserContent,
    displayContent:displayText,
    images:messageImages
  });

  addMessage("user",displayText,{
    images:currentAttachments.filter(file => file.type.startsWith("image/"))
  });

  messageInput.value = "";
  messageInput.style.height = "72px";
  saveHistory();

  busy = true;
  sendBtn.disabled = true;
  imageGenBtn.disabled = true;
  showTyping();

  const state = {reply:"",error:"",row:null};

  try {
    // Previous conversation now includes saved document contents.
    const history = conversation.slice(-13,-1).map(item => ({
      role:item.role,
      content:item.content
    }));

    let apiMessage = message || "Please examine my attachment.";

    for (const file of textAttachments) {
      apiMessage += "\n\nAttached file: " + file.name + "\n" + file.data;
    }

    const content = [];

    if (apiMessage) {
      content.push({type:"text",text:apiMessage});
    }

    for (const file of currentAttachments) {
      if (!file.type.startsWith("image/")) continue;

      const match = file.data.match(
        /^data:(image\/[a-zA-Z0-9.+-]+);base64,(.+)$/
      );

      if (!match) continue;

      content.push({
        type:"image",
        source:{
          type:"base64",
          media_type:match[1],
          data:match[2]
        }
      });
    }

    const messages = [...history,{role:"user",content}];

    const systemPrompt =
      getModeInstructions(currentMode) +
      (
        currentMode === "education" || isMathQuestion(message)
          ? "\n\n" + mathInstructions
          : ""
      );

    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        messages,
        system:systemPrompt
      })
    });

    if (!response.ok) {
      const errorText = await response.text();
      let errorMessage = errorText;

      try {
        const errorData = JSON.parse(errorText);

        errorMessage =
          errorData?.error?.message ||
          errorData?.message ||
          errorData?.error ||
          errorText;

      } catch {}

      if (typeof errorMessage !== "string") {
        errorMessage = JSON.stringify(errorMessage);
      }

      throw new Error(errorMessage || "The server returned an error.");
    }

    if (!response.body) {
      throw new Error("The server returned an empty response stream.");
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const {value,done} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value,{stream:true});
      buffer = buffer.replace(/\r\n/g,"\n");

      const events = buffer.split("\n\n");
      buffer = events.pop() || "";

      for (const eventBlock of events) {
        for (const line of eventBlock.split("\n")) {
          if (line.startsWith("data:")) {
            readStreamEvent(line.slice(5).trim(),state);
          }
        }
      }
    }

    buffer += decoder.decode();
    buffer = buffer.replace(/\r\n/g,"\n");

    if (buffer.trim()) {
      for (const line of buffer.split("\n")) {
        if (line.startsWith("data:")) {
          readStreamEvent(line.slice(5).trim(),state);
        }
      }
    }

    removeTyping();

    if (state.error) {
      throw new Error(state.error);
    }

    if (!state.reply.trim()) {
      throw new Error("The AI service returned an empty response. Please try again.");
    }

    const cleanReply = removeBoxedLatex(state.reply);

    conversation.push({
      role:"assistant",
      content:cleanReply,
      displayContent:cleanReply,
      images:[]
    });

    if (state.row) {
      const bubble = state.row.querySelector(".bubble");
      bubble.innerHTML = formatMarkdown(cleanReply);
      renderMath(bubble);
    } else {
      addMessage("assistant",cleanReply);
    }

    saveHistory();

    if (voiceEnabled) {
      speakText(cleanReply);
    }

  } catch(error) {
    removeTyping();
    console.error("Maynard AI request error:",error);

    const errorMessage =
      "I couldn't complete that request.\n\n**Error:** " +
      (error?.message || "An unexpected error occurred.");

    conversation.push({
      role:"assistant",
      content:errorMessage,
      displayContent:errorMessage,
      images:[]
    });

    addMessage("assistant",errorMessage);
    saveHistory();

  } finally {
    busy = false;
    sendBtn.disabled = false;
    imageGenBtn.disabled = false;
    messageInput.focus();
  }
}

/* INPUT EVENTS */

sendBtn.onclick = sendMessage;

messageInput.addEventListener("keydown",event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

messageInput.addEventListener("input",() => {
  messageInput.style.height = "auto";
  messageInput.style.height =
    Math.min(messageInput.scrollHeight,200) + "px";
});

/* MODE SELECTION */

$("modes").addEventListener("click",event => {
  const button = event.target.closest(".mode");
  if (!button) return;

  currentMode = button.dataset.mode;

  document.querySelectorAll(".mode").forEach(item => {
    item.classList.toggle("active",item === button);
  });

  $("modeTitle").textContent = modeNames[currentMode];
  saveHistory();
  $("sidebar").classList.remove("open");
});

/* WELCOME SUGGESTIONS */

$("welcome").addEventListener("click",event => {
  const button = event.target.closest(".suggestion");
  if (!button) return;

  messageInput.value = button.dataset.prompt;
  sendMessage();
});

/* NEW CHAT */

$("newChat").onclick = () => {
  if (busy || imageGenBusy) return;

  conversation = [];
  attachments = [];
  currentChatId = createChatId();
  currentMode = "general";

  updateAttachmentList();

  document.querySelectorAll(".mode").forEach(button => {
    button.classList.toggle("active",button.dataset.mode === "general");
  });

  $("modeTitle").textContent = "General Assistant";
  chat.innerHTML = "";
  $("welcome").classList.remove("hidden");

  renderHistoryList();
  $("sidebar").classList.remove("open");
};

/* CLEAR CURRENT CONVERSATION */

$("clearBtn").onclick = async () => {
  if (
    busy ||
    imageGenBusy ||
    !confirm("Clear this conversation and its saved pictures?")
  ) return;

  await deleteImagesForMessages(conversation);

  conversation = [];
  attachments = [];
  updateAttachmentList();

  savedChats = savedChats.filter(item => item.id !== currentChatId);
  currentChatId = createChatId();

  localStorage.setItem("maynard_chats",JSON.stringify(savedChats));

  chat.innerHTML = "";
  $("welcome").classList.remove("hidden");
  renderHistoryList();
};

/* EXPORT CONVERSATION */

$("exportBtn").onclick = () => {
  if (!conversation.length) {
    alert("There is no conversation to export.");
    return;
  }

  const output = conversation.map(item =>
    (item.role === "user" ? "YOU" : "MAYNARD AI") +
    "\n" + (item.displayContent || item.content) +
    (item.images?.length
      ? "\nPictures: " + item.images.map(image => image.name).join(", ")
      : "")
  ).join("\n\n-------------------------\n\n");

  const blob = new Blob([output],{type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "Maynard-AI-conversation.txt";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url),1000);
};

/* MOBILE MENU */

$("menuBtn").onclick = () => {
  $("sidebar").classList.toggle("open");
};

/* VOICE OUTPUT */

$("voiceToggle").onclick = () => {
  voiceEnabled = !voiceEnabled;

  $("voiceToggle").textContent = voiceEnabled
    ? "🔊 Voice On"
    : "🔊 Voice";

  if (!voiceEnabled && "speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
};

/* VOICE INPUT */

$("micBtn").onclick = () => {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onresult = event => {
    messageInput.value +=
      (messageInput.value ? " " : "") +
      event.results[0][0].transcript;

    messageInput.focus();
    messageInput.dispatchEvent(new Event("input"));
  };

  recognition.onerror = () => {
    alert("Voice input could not be completed.");
  };

  recognition.start();
};

/* LOAD CHAT HISTORY */

function loadHistory() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("maynard_chats") || "null"
    );

    if (Array.isArray(saved)) {
      savedChats = saved.filter(item =>
        item &&
        typeof item.id === "string" &&
        Array.isArray(item.messages)
      ).map(item => ({
        ...item,
        messages:item.messages.filter(message =>
          message &&
          ["user","assistant"].includes(message.role) &&
          typeof message.content === "string"
        ).map(message => ({
          role:message.role,
          content:message.content,
          displayContent:
            typeof message.displayContent === "string"
              ? message.displayContent
              : message.content,
          images:Array.isArray(message.images)
            ? message.images.filter(image =>
                image && typeof image.id === "string"
              )
            : []
        }))
      }));

    } else {
      const old = JSON.parse(
        localStorage.getItem("maynard_history") || "[]"
      );

      if (Array.isArray(old) && old.length) {
        const validOld = old.filter(item =>
          item &&
          ["user","assistant"].includes(item.role) &&
          typeof item.content === "string"
        );

        if (validOld.length) {
          savedChats = [{
            id:createChatId(),
            title:getChatTitle(validOld),
            mode:"general",
            updatedAt:Date.now(),
            messages:validOld.map(item => ({
              role:item.role,
              content:item.content,
              displayContent:item.content,
              images:[]
            }))
          }];

          localStorage.setItem(
            "maynard_chats",
            JSON.stringify(savedChats)
          );
        }
      }
    }

    savedChats.sort(
      (a,b) => (b.updatedAt || 0) - (a.updatedAt || 0)
    );

    if (savedChats.length) {
      openSavedChat(savedChats[0].id);
    } else {
      currentChatId = createChatId();
      conversation = [];
      renderConversation();
    }

    renderHistoryList();

  } catch(error) {
    console.warn("Could not load chat history:",error);

    savedChats = [];
    conversation = [];
    currentChatId = createChatId();

    renderConversation();
    renderHistoryList();
  }
}

/* INITIALISE MAYNARD AI */

window.addEventListener("load",async () => {
  try {
    if (window.MathJax?.startup?.promise) {
      await MathJax.startup.promise;
      mathReady = true;
    } else {
      console.warn("MathJax did not load. Check your internet connection.");
    }
  } catch(error) {
    console.warn("MathJax could not start:",error);
  }

  try {
    await openImageDatabase();
  } catch(error) {
    console.error("Image storage is unavailable:",error);
  }

  loadHistory();

  document.querySelectorAll(".bubble").forEach(element => {
    renderMath(element);
  });
});
</script>
