
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b16">
<title>Maynard AI Ultimate</title>
<link rel="manifest" href="/manifest.webmanifest">

<style>
:root{
--bg:#090b16;
--panel:#111629;
--panel2:#1b2140;
--text:#f5f5ff;
--muted:#a1a8c4;
--line:#2a3150;
--accent:#9875ff;
}
*{box-sizing:border-box}
body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui,Arial,sans-serif;
min-height:100vh;
}
button,textarea{font:inherit}
button{cursor:pointer;color:var(--text)}
.app{display:flex;min-height:100vh}
.sidebar{
width:255px;
background:#0d1020;
border-right:1px solid var(--line);
padding:18px;
display:flex;
flex-direction:column;
gap:15px;
}
.brand{
font-size:21px;
font-weight:800;
display:flex;
align-items:center;
gap:10px;
}
.logo{
width:40px;
height:40px;
border-radius:13px;
display:grid;
place-items:center;
background:linear-gradient(135deg,#a779ff,#348fff);
font-size:23px;
}
.btn{
padding:11px;
border:1px solid var(--line);
border-radius:12px;
background:var(--panel);
text-align:left;
}
.btn:hover,.mode.active{
background:var(--panel2);
border-color:var(--accent);
}
.new{
background:linear-gradient(120deg,#8058e9,#397eea);
border:0;
text-align:center;
font-weight:700;
}
.section{
font-size:11px;
letter-spacing:1.5px;
color:var(--muted);
}
.modes{display:grid;gap:7px}
.sidebar-bottom{
margin-top:auto;
display:grid;
gap:8px;
}
.main{
flex:1;
min-width:0;
display:flex;
flex-direction:column;
min-height:100vh;
}
.top{
height:65px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
}
.top button{
background:none;
border:0;
font-size:20px;
}
.content{
width:min(900px,100%);
margin:auto;
padding:25px 18px;
flex:1;
}
.welcome{
text-align:center;
padding:9vh 10px 30px;
}
.biglogo{font-size:50px}
.welcome h1{
font-size:clamp(27px,5vw,43px);
margin:8px 0;
}
.gradient{
background:linear-gradient(90deg,#b18cff,#64b8ff);
background-clip:text;
color:transparent;
}
.welcome p{color:var(--muted)}
.suggestions{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
max-width:650px;
margin:25px auto;
}
.suggestion{
background:var(--panel);
border:1px solid var(--line);
border-radius:14px;
padding:15px;
text-align:left;
}
.suggestion small{
display:block;
color:var(--muted);
margin-top:5px;
}
.messages{
display:grid;
gap:18px;
padding-bottom:25px;
}
.msg{
display:flex;
gap:11px;
align-items:flex-start;
}
.avatar{
width:35px;
height:35px;
flex:none;
border-radius:11px;
background:var(--panel2);
display:grid;
place-items:center;
font-weight:bold;
}
.user .avatar{background:#49378a}
.bubble{
background:var(--panel);
border:1px solid var(--line);
border-radius:4px 15px 15px 15px;
padding:13px 15px;
line-height:1.7;
white-space:pre-wrap;
overflow-wrap:anywhere;
max-width:100%;
}
.user .bubble{
background:#211b3c;
border-color:#44356c;
}
.composer-wrap{
position:sticky;
bottom:0;
background:linear-gradient(transparent,var(--bg) 18%);
padding:15px 18px 20px;
}
.composer{
width:min(850px,100%);
margin:auto;
background:var(--panel);
border:1px solid #343b5d;
border-radius:18px;
padding:12px;
}
textarea{
width:100%;
min-height:55px;
max-height:170px;
resize:vertical;
border:0;
outline:0;
background:transparent;
color:var(--text);
padding:8px;
}
.actions{
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
}
.actions button{
border:1px solid var(--line);
border-radius:10px;
padding:9px 12px;
background:var(--panel2);
}
.actions .send{
margin-left:auto;
background:linear-gradient(120deg,#8b62f3,#397eea);
border:0;
font-weight:bold;
}
#fileInput{display:none}
#fileNames{
font-size:12px;
color:var(--muted);
padding:5px;
}
.status{
color:var(--muted);
font-size:12px;
padding:8px 2px;
}
.footer{
text-align:center;
font-size:11px;
color:var(--muted);
padding:8px;
}
.hidden{display:none!important}
@media(max-width:700px){
.sidebar{
position:fixed;
z-index:10;
top:0;
bottom:0;
left:-280px;
transition:.2s;
}
.sidebar.open{left:0}
.top{padding:0 12px}
.content{padding:12px}
.welcome{padding-top:7vh}
.suggestions{grid-template-columns:1fr}
.composer-wrap{padding:10px}
.bubble{font-size:14px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">

<div class="brand">
<div class="logo">M</div>
Maynard AI
</div>

<button class="btn new" id="newChat">＋ New Chat</button>

<div class="section">AI MODES</div>

<div class="modes" id="modes">
<button class="btn mode active" data-mode="general">✦ General</button>
<button class="btn mode" data-mode="education">📚 Education</button>
<button class="btn mode" data-mode="writing">✍️ Writing</button>
<button class="btn mode" data-mode="coding">💻 Coding</button>
<button class="btn mode" data-mode="research">🔎 Research</button>
<button class="btn mode" data-mode="business">📈 Business</button>
<button class="btn mode" data-mode="creative">🎨 Creative</button>
<button class="btn mode" data-mode="translator">🌍 Translator</button>
<button class="btn mode" data-mode="summarizer">📄 Summarizer</button>
<button class="btn mode" data-mode="assistant">🤖 Personal assistant</button>
</div>

<div class="sidebar-bottom">
<button class="btn" id="historyBtn">▤ Chat history</button>
<button class="btn" id="exportBtn">⇩ Export chat</button>
<button class="btn" id="themeBtn">◐ Change theme</button>
<button class="btn" id="clearBtn">Clear chat</button>
</div>

</aside>

<main class="main">

<header class="top">
<div>
<button id="menuBtn" aria-label="Open menu">☰</button>
<strong id="modeTitle">General</strong>
</div>
<small>ULTIMATE 2.0</small>
</header>

<section class="content">

<div class="welcome" id="welcome">
<div class="biglogo">✦</div>
<h1>Welcome to <span class="gradient">Maynard AI</span></h1>
<p>Your multipurpose AI assistant. Ask, learn, create and explore.</p>

<div class="suggestions">
<button class="suggestion" data-prompt="Teach me something interesting today.">
📚 Learn something
<small>Understand difficult topics</small>
</button>
<button class="suggestion" data-prompt="Help me write a professional message.">
✍️ Writing assistant
<small>Create polished writing</small>
</button>
<button class="suggestion" data-prompt="Help me create a website.">
💻 Coding assistant
<small>Build and understand code</small>
</button>
<button class="suggestion" data-prompt="Give me creative ideas for a new project.">
💡 Creative ideas
<small>Explore new possibilities</small>
</button>
</div>
</div>

<div class="messages" id="messages"></div>

</section>

<div class="composer-wrap">
<div class="composer">

<textarea id="messageInput"
placeholder="Message Maynard AI..."
rows="2"></textarea>

<div id="fileNames"></div>

<div class="actions">
<button id="attachBtn">＋ Attach</button>
<input id="fileInput" type="file" multiple
accept=".txt,.md,.csv,.tsv,image/png,image/jpeg,image/webp">

<button id="voiceBtn">🎙 Voice</button>
<button id="readBtn">🔊 Read</button>
<button class="send" id="sendBtn">Send ↑</button>
</div>

<div class="status" id="status">Ready to help.</div>

</div>
<div class="footer">
Maynard AI can make mistakes. Check important information.
</div>
</div>

</main>
</div>

<script>
const $ = id => document.getElementById(id);

let mode = "general";
let conversation = [];
let attachments = [];
let busy = false;

const titles = {
general:"General",
education:"Education",
writing:"Writing",
coding:"Coding",
research:"Research",
business:"Business",
creative:"Creative",
translator:"Translator",
summarizer:"Summarizer",
assistant:"Personal assistant"
};

function escapeHTML(value){
return String(value).replace(/[&<>"']/g, char => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[char]);
}

function saveHistory(){
try{
localStorage.setItem(
"maynard_ultimate_history",
JSON.stringify(conversation.slice(-100))
);
}catch(error){}
}

function render(){
$("messages").innerHTML = conversation.map(item => `
<div class="msg ${item.role === "user" ? "user" : ""}">
<div class="avatar">${item.role === "user" ? "Y" : "M"}</div>
<div class="bubble">${escapeHTML(item.content)}</div>
</div>
`).join("");

$("welcome").classList.toggle(
"hidden",
conversation.length > 0
);

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});
}

function addMessage(role, content){
conversation.push({role,content});
render();
saveHistory();
}

function setMode(value){
mode = value;
document.querySelectorAll(".mode").forEach(button => {
button.classList.toggle(
"active",
button.dataset.mode === value
);
});
$("modeTitle").textContent = titles[value] || "General";
}

function setStatus(message){
$("status").textContent = message;
}

async function prepareFile(file){

if(file.size > 2 * 1024 * 1024){
throw new Error(file.name + " is larger than 2 MB.");
}

if(file.type.startsWith("image/")){

if(![
"image/jpeg",
"image/png",
"image/webp"
].includes(file.type)){
throw new Error("Use JPG, PNG or WEBP images.");
}

const data = await new Promise((resolve,reject)=>{
const reader = new FileReader();
reader.onload = () => resolve(reader.result);
reader.onerror = reject;
reader.readAsDataURL(file);
});

return {
kind:"image",
name:file.name,
type:file.type,
data
};
}

if(file.type === "application/pdf"){
throw new Error("PDF attachments are not supported in this version.");
}

const text = await file.text();

return {
kind:"text",
name:file.name,
text:text.slice(0,20000)
};
}

async function sendMessage(){

if(busy) return;

const input = $("messageInput");
const message = input.value.trim();

if(!message && attachments.length === 0){
setStatus("Please enter a message first.");
return;
}

const currentFiles = attachments.slice();

busy = true;
$("sendBtn").disabled = true;

input.value = "";
attachments = [];
$("fileNames").textContent = "";

const displayMessage = message +
(currentFiles.length
? "\n[Attachments: " +
currentFiles.map(file=>file.name).join(", ") + "]"
: "");

addMessage("user",displayMessage);

setStatus("Maynard AI is thinking...");

const history = conversation
.slice(0,-1)
.slice(-12)
.map(item=>({
role:item.role,
content:item.content
}));

try{

// THIS IS THE FRONTEND-TO-BACKEND CONNECTION.
const response = await fetch("/api/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:message || "Please examine my attached files.",
mode:mode,
history:history,
attachments:currentFiles
})
});

const raw = await response.text();

let data;

try{
data = JSON.parse(raw);
}catch(error){
throw new Error(
"Server returned an unexpected response. Check your Vercel deployment."
);
}

if(!response.ok){
throw new Error(
data.error || "Server error: " + response.status
);
}

if(!data.reply){
throw new Error("The AI returned an empty response.");
}

addMessage("assistant",data.reply);

setStatus(
"Connected · " + (data.model || "Groq AI")
);

}catch(error){

addMessage(
"assistant",
"Maynard AI could not complete your request.\n\n" +
error.message +
"\n\nPlease check your internet connection and try again."
);

setStatus("Request failed. Check the error above.");

}finally{

busy = false;
$("sendBtn").disabled = false;
input.focus();

}
}

$("sendBtn").onclick = sendMessage;

$("messageInput").addEventListener("keydown",event=>{
if(event.key === "Enter" && !event.shiftKey){
event.preventDefault();
sendMessage();
}
});

$("newChat").onclick = ()=>{
conversation = [];
saveHistory();
render();
setStatus("New conversation started.");
$("messageInput").focus();
};

$("modes").onclick = event=>{
const button = event.target.closest("[data-mode]");
if(button){
setMode(button.dataset.mode);
}
};

$("menuBtn").onclick = ()=>{
$("sidebar").classList.toggle("open");
};

$("attachBtn").onclick = ()=>{
$("fileInput").click();
};

$("fileInput").onchange = async event=>{

try{

const selected = [...event.target.files];

if(attachments.length + selected.length > 5){
throw new Error("You can attach up to five files.");
}

for(const file of selected){
attachments.push(await prepareFile(file));
}

$("fileNames").textContent =
attachments.map(file=>"📎 "+file.name).join(" · ");

setStatus("Files attached.");

}catch(error){

alert(error.message);

}finally{

event.target.value = "";

}

};

document.querySelectorAll("[data-prompt]").forEach(button=>{
button.onclick = ()=>{
$("messageInput").value = button.dataset.prompt;
$("messageInput").focus();
};
});

$("clearBtn").onclick = ()=>{
if(confirm("Clear this conversation?")){
$("newChat").click();
}
};

$("historyBtn").onclick = ()=>{
try{
const saved = JSON.parse(
localStorage.getItem("maynard_ultimate_history") || "[]"
);

alert(
saved.length
? "Your latest conversation is saved on this device."
: "No saved conversation found."
);
}catch(error){
alert("Could not load chat history.");
}
};

$("exportBtn").onclick = ()=>{

if(!conversation.length){
alert("There is no conversation to export.");
return;
}

const content = conversation.map(item=>
(item.role === "user" ? "You" : "Maynard AI") +
":\n" + item.content
).join("\n\n");

const blob = new Blob([content],{
type:"text/plain"
});

const url = URL.createObjectURL(blob);
const link = document.createElement("a");

link.href = url;
link.download = "maynard-ai-chat.txt";
link.click();

URL.revokeObjectURL(url);

};

$("themeBtn").onclick = ()=>{

const light = document.body.classList.toggle("light");

const variables = {
bg:light?"#f3f4fb":"#090b16",
panel:light?"#ffffff":"#111629",
panel2:light?"#e8e9f5":"#1b2140",
text:light?"#17182a":"#f5f5ff",
muted:light?"#60647c":"#a1a8c4",
line:light?"#d9dbea":"#2a3150"
};

Object.entries(variables).forEach(([key,value])=>{
document.documentElement.style.setProperty("--"+key,value);
});

};

$("voiceBtn").onclick = ()=>{

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Voice typing is not supported in this browser.");
return;
}

const recognition = new SpeechRecognition();

recognition.lang = "en-GH";
recognition.interimResults = false;

recognition.onresult = event=>{
$("messageInput").value +=
event.results[0][0].transcript;
};

recognition.onerror = ()=>{
setStatus("Voice recognition failed.");
};

recognition.start();

};

$("readBtn").onclick = ()=>{

const last = [...conversation]
.reverse()
.find(item=>item.role==="assistant");

if(!last){
alert("No AI response to read.");
return;
}

if(!("speechSynthesis" in window)){
alert("Read aloud is not supported.");
return;
}

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(last.content)
);

};

function loadHistory(){

try{

const saved = JSON.parse(
localStorage.getItem("maynard_ultimate_history") || "[]"
);

if(Array.isArray(saved)){
conversation = saved.filter(item=>
item &&
["user","assistant"].includes(item.role) &&
typeof item.content === "string"
);
}

}catch(error){

conversation = [];

}

render();

}

if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("/sw.js").catch(()=>{});
});
}

loadHistory();
</script>
</body>
</html>
