<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Maynard AI: a general assistant chat with image upload.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
<title>Maynard AI</title>
<style>
  :root { --bg:#030312; --bar:#05051a; --panel:#06061f; --line:#15153a; --btn:#232a40; --user:#0b0b45; --ink:#f2f4fa; --muted:#8a90a8; --accent:#6f7dff; --err:#ff8a80; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:radial-gradient(120% 40% at 0% 0%, #10104a 0%, var(--bg) 55%); color:var(--ink); font:16px/1.6 Roboto, system-ui, sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  header { display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--bar); border-bottom:1px solid var(--line); }
  header h1 { flex:1; margin:0; font-size:1.1rem; font-weight:700; }
  #menu { width:40px; height:34px; background:#777; border-radius:4px; font-size:1.2rem; }
  #voice { padding:10px 16px; background:var(--btn); border-radius:10px; font-weight:500; }
  #voice[aria-pressed="true"] { background:#3a4a9a; }

  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; }
  #scrim.open { opacity:1; pointer-events:auto; }
  #drawer { position:fixed; top:0; bottom:0; left:0; width:min(86vw, 320px); background:var(--bar); border-right:1px solid var(--line); padding:16px; overflow-y:auto; transform:translateX(-100%); transition:transform .2s; z-index:21; visibility:hidden; }
  #drawer.open { transform:none; visibility:visible; }
  #drawer h2 { margin:18px 0 6px; font-size:.85rem; font-weight:500; color:var(--muted); }
  .wide { width:100%; padding:12px; background:var(--user); border-radius:10px; font-weight:600; text-align:left; }
  .wide.ghost { background:var(--btn); margin-top:18px; }
  .item { display:flex; align-items:center; }
  .item button:first-child { flex:1; padding:9px 10px; text-align:left; background:none; border-radius:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item button[aria-current="true"] { background:var(--user); }
  .item .del { padding:6px 10px; background:none; color:var(--muted); }
  .empty { color:var(--muted); font-size:.9rem; padding:4px 10px; }

  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:20px; }
  .row { display:flex; gap:12px; align-items:flex-start; max-width:100%; }
  .row.user { flex-direction:row-reverse; align-self:flex-end; }
  .avatar { flex:none; min-width:44px; height:44px; padding:0 10px; display:grid; place-items:center; border-radius:12px; background:#071a2a; font-weight:700; font-size:.9rem; }
  .row.user .avatar { background:#0a0a2a; }
  .col { min-width:0; max-width:min(80%, 560px); }
  .bubble { padding:14px 18px; border-radius:18px; border:1px solid var(--line); white-space:pre-wrap; overflow-wrap:anywhere; }
  .row.assistant .bubble { background:var(--panel); }
  .row.user .bubble { background:var(--user); }
  .bubble.error { color:var(--err); }
  .bubble code { background:#0d0d33; padding:1px 5px; border-radius:5px; font:.9em ui-monospace, Menlo, monospace; }
  .bubble pre { margin:8px 0; padding:12px; background:#02020c; border:1px solid var(--line); border-radius:10px; overflow-x:auto; white-space:pre; }
  .bubble pre code { background:none; padding:0; }
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .thumbs img { max-width:100%; max-height:220px; border-radius:10px; }
  .note { color:var(--muted); font-size:.85rem; margin-bottom:6px; }
  .actions { display:flex; gap:18px; padding:6px 8px; }
  .actions button { background:none; color:var(--muted); font-size:.9rem; padding:2px 0; }

  form#composer { margin:0 12px; padding:14px; background:var(--panel); border:1px solid var(--line); border-radius:20px; }
  #hint { color:var(--err); font-size:.85rem; min-height:0; }
  #chips { display:flex; flex-wrap:wrap; gap:8px; }
  #chips:not(:empty) { margin-bottom:8px; }
  .chip { position:relative; }
  .chip img { width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--line); display:block; }
  .chip button { position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; background:#444; font-size:.75rem; line-height:1; }
  textarea { width:100%; min-height:44px; max-height:160px; resize:none; border:0; background:none; color:var(--ink); font:inherit; padding:4px; }
  textarea::placeholder { color:var(--muted); }
  .tools { display:flex; align-items:center; gap:10px; margin-top:8px; }
  .tools .icon { width:58px; height:52px; background:var(--btn); border-radius:12px; font-size:1.2rem; }
  .tools .icon.on { background:#a33; }
  .tools .icon:disabled { opacity:.4; cursor:default; }
  #send { margin-left:auto; padding:14px 22px; background:#08083a; border-radius:12px; font-weight:700; }
  footer { padding:10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); text-align:center; color:var(--muted); font-size:.8rem; }

  dialog { width:min(92vw, 440px); background:var(--bar); color:var(--ink); border:1px solid var(--line); border-radius:16px; padding:20px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h2 { margin:0 0 10px; font-size:1.1rem; }
  dialog label { display:block; margin-top:12px; font-size:.9rem; color:var(--muted); }
  dialog input { width:100%; margin-top:4px; padding:10px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  dialog p { font-size:.85rem; color:var(--muted); margin:10px 0 0; }
  dialog a { color:var(--accent); }
  .dlg-actions { display:flex; gap:10px; margin-top:16px; }
  .dlg-actions button { padding:10px 16px; border-radius:10px; background:var(--btn); }
  .dlg-actions .primary { background:#2a3bd0; font-weight:700; margin-left:auto; }
  @media (prefers-reduced-motion:reduce) { #scrim, #drawer { transition:none; } }
  @media (prefers-reduced-motion:no-preference) { #log { scroll-behavior:smooth; } }
</style>
</head>
<body>
  <header>
    <button id="menu" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
    <h1 id="title">General Assistant</h1>
    <button id="voice" type="button" aria-pressed="false">🔊 Voice</button>
  </header>

  <div id="scrim"></div>
  <aside id="drawer" aria-label="Menu">
    <button id="newChat" class="wide" type="button">＋ New chat</button>
    <h2>Assistants</h2>
    <div id="assistants"></div>
    <h2>Recent chats</h2>
    <div id="recent"></div>
    <button id="openSettings" class="wide ghost" type="button">⚙️ Settings</button>
  </aside>

  <main id="log" aria-live="polite"></main>

  <form id="composer">
    <div id="hint" role="status"></div>
    <div id="chips"></div>
    <textarea id="input" rows="1" placeholder="Message Maynard AI..." aria-label="Message"></textarea>
    <div class="tools">
      <button class="icon" id="attach" type="button" aria-label="Attach images">📎</button>
      <button class="icon" id="mic" type="button" aria-label="Dictate">🎙️</button>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <button id="send" type="submit">Send ➤</button>
    </div>
  </form>
  <footer>Maynard AI can make mistakes. Check important answers.</footer>

  <dialog id="settings">
    <h2>Settings</h2>
    <label>Your own Anthropic API key (optional)
      <input id="keyInput" type="password" autocomplete="off" placeholder="sk-ant-...">
    </label>
    <label>Model
      <input id="modelInput" type="text" autocomplete="off">
    </label>
    <p>Leave the key blank to use this site's built-in assistant. If you enter a key, it is stored only in this browser and sent only to Anthropic. Get one at
      <a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a>.</p>
    <div class="dlg-actions">
      <button id="clearData" type="button">Delete saved chats</button>
      <button id="saveSettings" class="primary" type="button">Save</button>
    </div>
  </dialog>

<script>
(() => {
  "use strict";

  const API_URL = "https://api.anthropic.com/v1/messages";
  const DEFAULT_MODEL = "claude-sonnet-5-5";
  const MAX_IMAGES = 4;

  const ASSISTANTS = [
    { id: "general", name: "General Assistant", icon: "💬",
      greeting: "Hello! How can I help you today?",
      system: "You are Maynard AI, a helpful, accurate and friendly general assistant. Answer clearly and concisely. If a request is ambiguous, make a reasonable assumption and say so, or ask one short question." },
    { id: "writer", name: "Writing Helper", icon: "✍️",
      greeting: "What are we writing? Paste a draft or tell me what you need.",
      system: "You are a writing assistant. Draft, rewrite and proofread text in the tone the user asks for. Keep the user's meaning, fix grammar, and explain major changes briefly." },
    { id: "coder", name: "Coding Helper", icon: "💻",
      greeting: "Share your code or describe what you want to build.",
      system: "You are a careful programming assistant. Give working code in fenced code blocks, explain the key idea in a few sentences, and point out edge cases or bugs." },
    { id: "tutor", name: "Study Tutor", icon: "🎓",
      greeting: "What are you studying? I can explain it and quiz you.",
      system: "You are a patient tutor. Explain concepts step by step with simple examples, check understanding with a short question, and never just hand over answers to graded work without explaining." },
    { id: "math", name: "Math Solver", icon: "➗",
      greeting: "Send a math problem, or a photo of one, and I'll solve it step by step.",
      system: "You are a math tutor. Solve problems step by step, label each step, and finish with a check of the answer. Read any attached image carefully before solving." },
    { id: "translator", name: "Translator", icon: "🌐",
      greeting: "Tell me the language you want, then send the text.",
      system: "You are a translator. Translate faithfully and naturally into the language the user asks for. If no target language is given, ask for it. Add short notes only when a phrase has no direct equivalent." },
  ];

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  const $ = (s) => document.querySelector(s);
  const log = $("#log"), input = $("#input"), form = $("#composer");
  const sendBtn = $("#send"), voiceBtn = $("#voice"), micBtn = $("#mic");
  const chipsEl = $("#chips"), hintEl = $("#hint"), drawer = $("#drawer"), scrim = $("#scrim");
  const dlg = $("#settings");

  let settings = Object.assign({ key: "", model: DEFAULT_MODEL }, store.get("maynard.settings", {}));
  let chats = store.get("maynard.chats", []);
  let assistant = ASSISTANTS.find((a) => a.id === store.get("maynard.assistant", "general")) || ASSISTANTS[0];
  let chat = newChat();
  let pending = [];
  let busy = false, controller = null, autoSpeak = false, hintTimer = 0;

  function newChat() {
    return { id: Date.now().toString(36), assistantId: assistant.id, title: "New chat", messages: [] };
  }

  /* ---------- helpers ---------- */
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function md(text) {
    return text.split("```").map((part, i) => {
      if (i % 2) return "<pre><code>" + esc(part.replace(/^[A-Za-z0-9+#-]*\n/, "")) + "</code></pre>";
      return esc(part)
        .replace(/`([^`\n]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    }).join("");
  }

  function setBody(el, text) { el.dataset.raw = text; el.innerHTML = md(text); }

  function flash(msg) {
    hintEl.textContent = msg;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => (hintEl.textContent = ""), 4000);
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }

  function actionButton(label, onClick) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.addEventListener("click", () => onClick(b));
    return b;
  }

  /* ---------- messages ---------- */
  function addMessage(role, text, images, note) {
    const row = document.createElement("div");
    row.className = "row " + role;
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "You" : "M";
    const col = document.createElement("div");
    col.className = "col";
    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (images && images.length) {
      const g = document.createElement("div");
      g.className = "thumbs";
      images.forEach((src) => { const im = new Image(); im.src = src; im.alt = "Attached image"; g.append(im); });
      bubble.append(g);
    }
    if (note) { const n = document.createElement("div"); n.className = "note"; n.textContent = note; bubble.append(n); }
    const body = document.createElement("div");
    setBody(body, text);
    bubble.append(body);
    col.append(bubble);

    if (role === "assistant") {
      const actions = document.createElement("div");
      actions.className = "actions";
      actions.append(
        actionButton("Copy", async (b) => {
          try { await navigator.clipboard.writeText(body.dataset.raw || ""); b.textContent = "Copied"; }
          catch (e) { b.textContent = "Can't copy"; }
          setTimeout(() => (b.textContent = "Copy"), 1500);
        }),
        actionButton("Read aloud", () => speak(body.dataset.raw || ""))
      );
      col.append(actions);
    }
    row.append(avatar, col);
    log.append(row);
    log.scrollTop = log.scrollHeight;
    return { body, bubble };
  }

  function renderChat() {
    log.textContent = "";
    $("#title").textContent = assistant.name;
    addMessage("assistant", assistant.greeting);
    chat.messages.forEach((m) => {
      const lost = m.imgs && !(m.images && m.images.length);
      addMessage(m.role, m.text, m.images, lost ? "🖼 " + m.imgs + " image(s) not saved" : "");
    });
  }

  /* ---------- drawer ---------- */
  function openDrawer(open) {
    drawer.classList.toggle("open", open);
    scrim.classList.toggle("open", open);
    $("#menu").setAttribute("aria-expanded", String(open));
    if (open) renderDrawer();
  }

  function renderDrawer() {
    const box = $("#assistants");
    box.textContent = "";
    ASSISTANTS.forEach((a) => {
      const item = document.createElement("div");
      item.className = "item";
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = a.icon + "  " + a.name;
      if (a.id === assistant.id) b.setAttribute("aria-current", "true");
      b.addEventListener("click", () => { assistant = a; store.set("maynard.assistant", a.id); startNewChat(); });
      item.append(b);
      box.append(item);
    });

    const rec = $("#recent");
    rec.textContent = "";
    if (!chats.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "No saved chats yet."; rec.append(e); }
    chats.forEach((c) => {
      const item = document.createElement("div");
      item.className = "item";
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.title;
      if (c.id === chat.id) b.setAttribute("aria-current", "true");
      b.addEventListener("click", () => {
        if (busy) return flash("Wait for the reply to finish, or press Stop.");
        chat = JSON.parse(JSON.stringify(c));
        assistant = ASSISTANTS.find((a) => a.id === c.assistantId) || ASSISTANTS[0];
        pending = []; renderChips(); renderChat(); openDrawer(false);
      });
      const del = document.createElement("button");
      del.type = "button"; del.className = "del"; del.textContent = "✕";
      del.setAttribute("aria-label", "Delete chat " + c.title);
      del.addEventListener("click", () => {
        chats = chats.filter((x) => x.id !== c.id);
        store.set("maynard.chats", chats);
        if (c.id === chat.id) startNewChat(); else renderDrawer();
      });
      item.append(b, del);
      rec.append(item);
    });
  }

  function startNewChat() {
    if (busy && controller) controller.abort();
    chat = newChat(); pending = []; renderChips(); renderChat(); openDrawer(false);
  }

  function saveChat() {
    const slim = Object.assign({}, chat, {
      messages: chat.messages.map((m) => ({ role: m.role, text: m.text, imgs: (m.images && m.images.length) || m.imgs || 0 })),
    });
    const i = chats.findIndex((c) => c.id === chat.id);
    if (i >= 0) chats[i] = slim; else chats.unshift(slim);
    chats = chats.slice(0, 30);
    store.set("maynard.chats", chats);
  }

  /* ---------- images ---------- */
  async function toDataUrl(file) {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.85);
  }

  async function addFiles(files) {
    for (const f of files) {
      if (!f.type.startsWith("image/")) { flash("Only image files can be attached."); continue; }
      if (pending.length >= MAX_IMAGES) { flash("You can attach up to " + MAX_IMAGES + " images."); break; }
      try { pending.push(await toDataUrl(f)); } catch (e) { flash("Couldn't read " + f.name + "."); }
    }
    renderChips();
  }

  function renderChips() {
    chipsEl.textContent = "";
    pending.forEach((src, i) => {
      const w = document.createElement("div");
      w.className = "chip";
      const im = new Image(); im.src = src; im.alt = "Attached image " + (i + 1);
      const x = document.createElement("button");
      x.type = "button"; x.textContent = "✕"; x.setAttribute("aria-label", "Remove image " + (i + 1));
      x.addEventListener("click", () => { pending.splice(i, 1); renderChips(); });
      w.append(im, x);
      chipsEl.append(w);
    });
  }

  /* ---------- API ---------- */
  function apiMessages() {
    return chat.messages.map((m) => {
      const content = [];
      (m.images || []).forEach((src) => {
        const parts = src.split(",");
        content.push({ type: "image", source: { type: "base64", media_type: parts[0].slice(5, parts[0].indexOf(";")), data: parts[1] } });
      });
      if (m.imgs && !(m.images && m.images.length)) content.push({ type: "text", text: "[Earlier, the user attached " + m.imgs + " image(s) that are no longer available.]" });
      if (m.text) content.push({ type: "text", text: m.text });
      return { role: m.role, content };
    });
  }

  async function streamReply(messages, onText, signal) {
    const system = assistant.system + " Today is " + new Date().toDateString() + ".";

    // No personal key set: use the site's own backend (api/chat.mjs), which holds the key.
    const res = !settings.key
      ? await fetch("/api/chat", {
          method: "POST", signal,
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ messages, system }),
        })
      : await fetch(API_URL, {
          method: "POST", signal,
          headers: {
            "content-type": "application/json",
            "x-api-key": settings.key,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true",
          },
          body: JSON.stringify({
            model: settings.model || DEFAULT_MODEL,
            max_tokens: 2048,
            stream: true,
            system,
            messages,
          }),
        });

    if (!res.ok) {
      let msg = "Request failed (" + res.status + ")";
      try { msg = (await res.json()).error.message || msg; } catch (e) {}
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", out = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        let evt = null;
        try { evt = JSON.parse(line.slice(5)); } catch (e) { continue; }
        if (evt.type === "error") throw new Error((evt.error && evt.error.message) || "Stream error");
        if (evt.type === "content_block_delta" && evt.delta && evt.delta.text) { out += evt.delta.text; onText(out); }
      }
    }
    return out;
  }

  function setBusy(v) {
    busy = v;
    sendBtn.textContent = v ? "Stop ■" : "Send ➤";
  }

  async function send() {
    if (busy) { controller.abort(); return; }
    const text = input.value.trim();
    if (!text && !pending.length) return;

    const msg = { role: "user", text, images: pending.slice() };
    chat.messages.push(msg);
    if (chat.title === "New chat") chat.title = (text || "Image chat").slice(0, 40);
    addMessage("user", text, msg.images);
    input.value = ""; input.style.height = "auto"; pending = []; renderChips();

    const view = addMessage("assistant", "…");
    controller = new AbortController();
    setBusy(true);
    let out = "";
    try {
      await streamReply(apiMessages(), (t) => { out = t; setBody(view.body, t); log.scrollTop = log.scrollHeight; }, controller.signal);
    } catch (err) {
      if (err.name !== "AbortError") {
        view.bubble.classList.add("error");
        if (!out) view.body.textContent = "⚠️ " + err.message;
        else view.body.textContent += "\n\n⚠️ " + err.message;
      } else if (!out) {
        view.body.textContent = "Stopped.";
      }
    } finally {
      setBusy(false);
      controller = null;
    }
    if (out) {
      chat.messages.push({ role: "assistant", text: out });
      if (autoSpeak) speak(out);
    }
    saveChat();
  }

  /* ---------- settings ---------- */
  function openSettings() {
    openDrawer(false);
    $("#keyInput").value = settings.key;
    $("#modelInput").value = settings.model;
    dlg.showModal();
  }
  $("#openSettings").addEventListener("click", openSettings);
  $("#saveSettings").addEventListener("click", () => {
    settings = { key: $("#keyInput").value.trim(), model: $("#modelInput").value.trim() || DEFAULT_MODEL };
    store.set("maynard.settings", settings);
    dlg.close();
    flash("");
  });
  $("#clearData").addEventListener("click", () => {
    chats = []; store.set("maynard.chats", chats); dlg.close(); startNewChat();
  });

  /* ---------- events ---------- */
  form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });
  input.addEventListener("paste", (e) => {
    const files = Array.from(e.clipboardData.files).filter((f) => f.type.startsWith("image/"));
    if (files.length) { e.preventDefault(); addFiles(files); }
  });

  $("#attach").addEventListener("click", () => $("#file").click());
  $("#file").addEventListener("change", (e) => { addFiles(Array.from(e.target.files)); e.target.value = ""; });

  $("#menu").addEventListener("click", () => openDrawer(!drawer.classList.contains("open")));
  scrim.addEventListener("click", () => openDrawer(false));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") openDrawer(false); });
  $("#newChat").addEventListener("click", startNewChat);

  voiceBtn.addEventListener("click", () => {
    autoSpeak = !autoSpeak;
    voiceBtn.setAttribute("aria-pressed", String(autoSpeak));
    if (!autoSpeak && "speechSynthesis" in window) speechSynthesis.cancel();
  });

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    micBtn.disabled = true;
    micBtn.title = "Dictation isn't supported in this browser";
  } else {
    const rec = new SR();
    rec.interimResults = false;
    rec.onresult = (e) => { input.value += (input.value ? " " : "") + e.results[0][0].transcript; input.focus(); };
    rec.onend = () => micBtn.classList.remove("on");
    micBtn.addEventListener("click", () => {
      if (micBtn.classList.contains("on")) return rec.stop();
      micBtn.classList.add("on");
      rec.start();
    });
  }

  renderChat();
})();
</script>
</body>
</html>
