    headers: { "Content-Type": "application/json" },  
    body: JSON.stringify({ action, ...data })  
  });  
  
  const result = await response.json().catch(() => ({}));  
  
  if (!response.ok || result.error) {  
    throw new Error(result.error || "Request failed.");  
  }  
  
  return result;  
}  
  
/* HTML ESCAPING */  
  
function escapeHTML(value) {  
  return String(value).replace(/[&<>"']/g, char => ({  
    "&": "&amp;",  
    "<": "&lt;",  
    ">": "&gt;",  
    '"': "&quot;",  
    "'": "&#39;"  
  })[char]);  
}  
  
/* INLINE MARKDOWN */  
  
function renderInline(value) {  
  let safe = escapeHTML(value);  
  
  safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");  
  safe = safe.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");  
  safe = safe.replace(/\*(.*?)\*/g, "<em>$1</em>");  
  
  safe = safe.replace(  
    /([^]+)\](https?:\/\/[^)\s]+)/g,  
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'  
  );  
  
  return safe;  
}  
  
/* MARKDOWN RENDERER */  
  
function renderMarkdown(text) {  
  const lines = String(text).replace(/\r/g, "").split("\n");  
  
  let html = "";  
  let paragraph = [];  
  let listType = null;  
  let listItems = [];  
  let tableRows = [];  
  
  function flushParagraph() {  
    if (!paragraph.length) return;  
  
    html += "<p>" + paragraph.map(renderInline).join("<br>") + "</p>";  
    paragraph = [];  
  }  
  
  function flushList() {  
    if (!listItems.length) return;  
  
    html += "<" + listType + ">";  
  
    listItems.forEach(item => {  
      html += "<li>" + renderInline(item) + "</li>";  
    });  
  
    html += "</" + listType + ">";  
  
    listItems = [];  
    listType = null;  
  }  
  
  function flushTable() {  
    if (!tableRows.length) return;  
  
    const rows = tableRows.filter(cells =>  
      !cells.every(cell => /^:?-{3,}:?$/.test(cell))  
    );  
  
    if (rows.length) {  
      html += '<div class="table-scroll"><table>';  
  
      rows.forEach((cells, index) => {  
        const tag = index === 0 ? "th" : "td";  
        html += "<tr>";  
  
        cells.forEach(cell => {  
          html += "<" + tag + ">" + renderInline(cell) + "</" + tag + ">";  
        });  
  
        html += "</tr>";  
      });  
  
      html += "</table></div>";  
    }  
  
    tableRows = [];  
  }  
  
  function splitTableRow(line) {  
    return line.trim()  
      .replace(/^\|/, "")  
      .replace(/\|$/, "")  
      .split("|")  
      .map(cell => cell.trim());  
  }  
  
  for (let i = 0; i < lines.length; i++) {  
    const line = lines[i];  
  
    if (line.trim().startsWith("```")) {  
      flushParagraph();  
      flushList();  
      flushTable();  
  
      const language = line.trim().slice(3).trim().toLowerCase();  
      const codeLines = [];  
  
      i++;  
  
      while (i < lines.length && !lines[i].trim().startsWith("```")) {  
        codeLines.push(lines[i]);  
        i++;  
      }  
  
      const code = codeLines.join("\n");  
  
      if (language === "mermaid") {  
        html += '<div class="diagram-container"><pre class="mermaid">' +  
          escapeHTML(code) + "</pre></div>";  } else {  
    html += "<pre><code>" + escapeHTML(code) + "</code></pre>";  
  }  

  continue;  
}  

if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {  
  flushParagraph();  
  flushList();  
  flushTable();  
  continue;  
}  

if (!line.trim()) {  
  flushParagraph();  
  flushList();  
  flushTable();  
  continue;  
}  

if (line.includes("|") && line.trim().startsWith("|")) {  
  flushParagraph();  
  flushList();  
  tableRows.push(splitTableRow(line));  
  continue;  
}  

if (tableRows.length) flushTable();  

const heading = line.match(/^(#{1,3})\s+(.+)$/);  

if (heading) {  
  flushParagraph();  
  flushList();  

  const level = heading[1].length;  
  html += "<h" + level + ">" + renderInline(heading[2]) + "</h" + level + ">";  
  continue;  
}  

const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);  

if (ordered) {  
  flushParagraph();  

  if (listType !== "ol") {  
    flushList();  
    listType = "ol";  
  }  

  listItems.push(ordered[1]);  
  continue;  
}  

const unordered = line.match(/^\s*[-*+]\s+(.+)$/);  

if (unordered) {  
  flushParagraph();  

  if (listType !== "ul") {  
    flushList();  
    listType = "ul";  
  }  

  listItems.push(unordered[1]);  
  continue;  
}  

flushList();  
paragraph.push(line);

}

flushParagraph();
flushList();
flushTable();

return html;
}

/* DIAGRAMS AND MATHEMATICS */

async function typeset(element) {
if (window.mermaid) {
try {
mermaid.initialize({
startOnLoad: false,
securityLevel: "strict",
theme: "dark",
flowchart: {
htmlLabels: false,
curve: "basis"
}
});

const diagrams = element.querySelectorAll(  
    ".mermaid:not([data-processed])"  
  );  

  if (diagrams.length) await mermaid.run({ nodes: diagrams });  

} catch (error) {  
  console.warn("Diagram rendering issue:", error);  
}

}

if (window.MathJax?.typesetPromise) {
try {
await MathJax.typesetPromise([element]);
} catch (error) {
console.warn("MathJax rendering issue:", error);
}
}
}

/* ADD CHAT MESSAGE */

function addMessage(role, content, options = {}) {
$("welcome").style.display = "none";

const row = document.createElement("div");

row.className = "message " +
(role === "user" ? "user-message" : "assistant-message");

const bubble = document.createElement("div");
bubble.className = "bubble";
bubble.innerHTML = renderMarkdown(content);

if (options.imageUrl) {
const img = document.createElement("img");
img.src = options.imageUrl;
img.alt = "Uploaded image";
bubble.appendChild(img);
}

row.appendChild(bubble);
$("messages").appendChild(row);

$("chatArea").scrollTop = $("chatArea").scrollHeight;
typeset(bubble);
}

/* MODE MENU */

function setMode(mode) {
if (!MODE_SETTINGS[mode]) return;

state.mode = mode;
$("currentModeLabel").textContent = MODE_SETTINGS[mode].label;

document.querySelectorAll("[data-mode]").forEach(button => {
button.classList.toggle("active", button.dataset.mode === mode);
});

$("modeMenu").classList.remove("open");
}

$("modeBtn").onclick = event => {
event.stopPropagation();
$("modeMenu").classList.toggle("open");
};

document.querySelectorAll("[data-mode]").forEach(button => {
button.onclick = () => setMode(button.dataset.mode);
});

document.addEventListener("click", event => {
if (!event.target.closest(".mode-wrap")) {
$("modeMenu").classList.remove("open");
}
});

/* MODAL */

function showModal(content) {
$("modalContent").innerHTML = content;
$("modalBackdrop").style.display = "flex";
}

function closeModal() {
$("modalBackdrop").style.display = "none";
$("modalContent").innerHTML = "";
}

/* RESET CHAT */

function resetChat() {
state.messages = [];
state.activeId = null;
state.title = "New conversation";
state.image = null;
state.imageName = null;

$("messages").innerHTML = "";
$("welcome").style.display = "block";
$("prompt").value = "";

$("imagePreview").innerHTML = "";
$("imagePreview").style.display = "none";

$("fileInput").value = "";
$("cameraInput").value = "";
}

function newChat() {
resetChat();
$("prompt").focus();
}

/* SAVE HISTORY */

async function saveHistory() {
if (!state.messages.length) return;

try {
const first = state.messages.find(item => item.role === "user")?.content ||
"New conversation";

const title = state.title === "New conversation"  
  ? first.slice(0, 55)  
  : state.title;  

const result = await api("history_save", {  
  id: state.activeId,  
  title,  
  messages: state.messages  
});  

state.activeId = result.id || state.activeId;  
state.title = title;  

await loadHistory();

} catch (error) {
console.error("History save failed:", error);
}
}

/* LOAD HISTORY */

async function loadHistory() {
try {
const result = await api("history_list");
const list = $("historyList");

list.innerHTML = "";  

(result.items || result.histories || []).forEach(item => {  
  const row = document.createElement("div");  
  row.className = "history-item";  

  const open = document.createElement("button");  
  open.className = "history-open";  
  open.textContent = item.title || "Untitled conversation";  
  open.title = open.textContent;  
  open.onclick = () => openHistory(item.id);  

  const rename = document.createElement("button");  
  rename.className = "history-action";  
  rename.textContent = "✎";  
  rename.title = "Rename conversation";  
  rename.onclick = () => renameHistory(item.id, item.title || "");  

  const remove = document.createElement("button");  
  remove.className = "history-action";  
  remove.textContent = "×";  
  remove.title = "Delete conversation";  
  remove.onclick = () => deleteHistory(item.id);  

  row.append(open, rename, remove);  
  list.appendChild(row);  
});

} catch (error) {
console.warn("Could not load saved history:", error.message);
}
}

/* OPEN HISTORY */

async function openHistory(id) {
try {
const result = await api("history_get", { id });
const history = result.history || result;

state.activeId = history.id || id;  
state.title = history.title || "Conversation";  
state.messages = history.messages || [];  

$("messages").innerHTML = "";  
$("welcome").style.display = "none";  

state.messages.forEach(message => {  
  addMessage(message.role, message.content || "");  
});

} catch (error) {
alert("Could not open conversation: " + error.message);
}
}

/* RENAME HISTORY */

async function renameHistory(id, oldTitle) {
const title = prompt("Enter a new conversation title:", oldTitle);

if (!title || !title.trim()) return;

try {
await api("history_rename", { id, title: title.trim() });

if (state.activeId === id) state.title = title.trim();  

await loadHistory();

} catch (error) {
alert("Rename failed: " + error.message);
}
}

/* DELETE HISTORY */

async function deleteHistory(id) {
if (!confirm("Delete this saved conversation?")) return;

try {
await api("history_delete", { id });

if (state.activeId === id) newChat();  

await loadHistory();

} catch (error) {
alert("Delete failed: " + error.message);
}
}

/* CLEAR HISTORY */

async function clearHistory() {
if (!confirm("Delete all saved conversations?")) return;

try {
await api("history_clear");
newChat();
await loadHistory();

} catch (error) {
alert("Could not clear history: " + error.message);
}
}

/* IMAGE PREVIEW */

function attachImage(file) {
if (!file) return;

if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
alert("Choose a JPG, PNG or WEBP image.");
$("fileInput").value = "";
return;
}

if (file.size > 8 * 1024 * 1024) {
alert("Please choose an image smaller than 8 MB.");
$("fileInput").value = "";
return;
}

const reader = new FileReader();

reader.onload = () => {
state.image = reader.result;
state.imageName = file.name;

const preview = $("imagePreview");  
preview.innerHTML = "";  

const container = document.createElement("div");  
container.className = "preview-container";  

const img = document.createElement("img");  
img.src = reader.result;  
img.alt = "Image preview";  

const info = document.createElement("div");  
info.className = "preview-info";  

const title = document.createElement("strong");  
title.textContent = "Image attached";  

const filename = document.createElement("p");  
filename.textContent = file.name;  

const status = document.createElement("span");  
status.textContent = "Ready to send to MAYNARD AI";  

info.append(title, filename, status);  

const remove = document.createElement("button");  
remove.type = "button";  
remove.className = "remove-image";  
remove.textContent = "Remove";  

remove.onclick = () => {  
  state.image = null;  
  state.imageName = null;  
  preview.innerHTML = "";  
  preview.style.display = "none";  
  $("fileInput").value = "";  
  $("cameraInput").value = "";  
};  

container.append(img, info, remove);  
preview.appendChild(container);  
preview.style.display = "block";

};

reader.onerror = () => {
alert("Could not read this image. Please try again.");
};

reader.readAsDataURL(file);
}

/* CAMERA ACCESS */

$("cameraBtn").onclick = () => {
$("cameraInput").click();
};

$("cameraInput").onchange = event => {
const file = event.target.files[0];

if (file) {
attachImage(file);
}

event.target.value = "";
};

/* IMAGE DOWNLOADER */

async function downloadImage(imageSource) {
if (!imageSource) {
alert("No image is available to download.");
return;
}

try {
const response = await fetch(imageSource);

if (!response.ok) {  
  throw new Error("Could not retrieve the image.");  
}  

const blob = await response.blob();  
const objectURL = URL.createObjectURL(blob);  

const link = document.createElement("a");  
link.href = objectURL;  
link.download = "maynard-ai-image.png";  

document.body.appendChild(link);  
link.click();  
link.remove();  

setTimeout(() => URL.revokeObjectURL(objectURL), 30000);

} catch (error) {
alert(
"Automatic download was blocked. The image will open in a new tab so you can save it."
);

window.open(imageSource, "_blank");

}
}

/* SEND MESSAGE */

async function sendMessage() {
const text = $("prompt").value.trim();

if ((!text && !state.image) || state.busy) return;

state.busy = true;
$("sendBtn").disabled = true;

const image = state.image;
const userContent = text || "Please examine this image.";

addMessage("user", userContent, {
imageUrl: image || null
});

state.messages.push({
role: "user",
content: userContent
});

$("prompt").value = "";

state.image = null;
state.imageName = null;

$("imagePreview").innerHTML = "";
$("imagePreview").style.display = "none";
$("fileInput").value = "";
$("cameraInput").value = "";

const typing = document.createElement("div");
typing.className = "typing";
typing.textContent = "MAYNARD AI is thinking...";

$("messages").appendChild(typing);
$("chatArea").scrollTop = $("chatArea").scrollHeight;

try {
const systemMessage = {
role: "system",
content: MODE_SETTINGS[state.mode].instruction +
"\n\n" + VISUAL_INSTRUCTIONS
};

const requestMessages = [  
  systemMessage,  
  ...state.messages.slice(-40).map(message => ({  
    role: message.role,  
    content: message.content  
  }))  
];  

const result = await api("chat", {  
  messages: requestMessages,  
  image  
});  

typing.remove();  

const answer = result.reply || "I could not generate a response.";  

addMessage("assistant", answer);  

state.messages.push({  
  role: "assistant",  
  content: answer  
});  

await saveHistory();

} catch (error) {
typing.remove();

addMessage("assistant", "I encountered an error: " + error.message);

} finally {
state.busy = false;
$("sendBtn").disabled = false;
$("prompt").focus();
}
}

function openCalculator() {
showModal(`
<h2>Mathematical calculator</h2>

<p style="color:#999">  
  Enter an expression such as (25 * 4) / 2,  
  sqrt(144), sin(pi / 2), or 2^8.  
</p>  

<input id="calcInput" placeholder="Enter mathematical expression">  

<div class="modal-row">  
  <button id="calculateBtn">Calculate</button>  
  <button id="clearCalcBtn">Clear</button>  
</div>  

<div class="result" id="calcResult">  
  Your result will appear here.  
</div>  

<p style="color:#888;font-size:12px">  
  This calculator uses Math.js.  
</p>

`);

$("calculateBtn").onclick = () => {
try {
const expression = $("calcInput").value.trim();

if (!expression) throw new Error("Enter an expression first.");  

  const result = math.evaluate(expression);  

  $("calcResult").textContent = math.format(result, { precision: 14 });  

} catch (error) {  
  $("calcResult").textContent = "Calculation error: " + error.message;  
}

};

$("clearCalcBtn").onclick = () => {
$("calcInput").value = "";
$("calcResult").textContent = "Your result will appear here.";
};
}

/* IMAGE STUDIO */

function openImageStudio() {
showModal(`
<h2>AI image studio</h2>

<p style="color:#999">  
  Describe the original image you want MAYNARD AI to create.  
</p>  

<textarea id="imagePrompt" placeholder="Describe your image..."></textarea>  

<div class="modal-row">  
  <button id="generateImageBtn">Generate image</button>  
</div>  

<div id="imageResult" class="result" style="display:none"></div>  

<p class="note">  
  Image generation requires a configured Stability AI key.  
</p>

`);

$("generateImageBtn").onclick = async () => {
const prompt = $("imagePrompt").value.trim();

if (!prompt) {  
  alert("Describe the image first.");  
  return;  
}  

$("generateImageBtn").disabled = true;  
$("generateImageBtn").textContent = "Generating...";  

try {  
  const result = await api("image_generate", { prompt });  

  const box = $("imageResult");  
  box.style.display = "block";  
  box.innerHTML = "";  

  const imageSource = result.image || result.imageUrl || result.url;  

  if (imageSource) {  
    const img = document.createElement("img");  
    img.src = imageSource;  
    img.alt = "Generated image";  
    box.appendChild(img);  

    /* SEPARATE IMAGE DOWNLOAD BUTTON */  

    const download = document.createElement("button");  
    download.type = "button";  
    download.className = "download-image-btn";  
    download.textContent = "⬇ Download image";  

    download.onclick = () => downloadImage(imageSource);  

    box.appendChild(download);  

  } else {  
    box.textContent = result.message || "No image was returned.";  
  }  

} catch (error) {  
  alert("Image generation failed: " + error.message);  

} finally {  
  $("generateImageBtn").disabled = false;  
  $("generateImageBtn").textContent = "Generate image";  
}

};
}

/* LIVE FOOTBALL */

function loadFootball() {
showModal(`
<h2>Live football</h2>

<p style="color:#999">  
  Retrieve current fixtures and scores.  
</p>  

<div class="modal-row">  
  <button id="refreshFootballBtn">Refresh scores</button>  
</div>  

<div class="result" id="footballResult">  
  Press refresh to load fixtures.  
</div>

`);

$("refreshFootballBtn").onclick = async () => {
$("footballResult").textContent = "Loading fixtures...";

try {  
  const result = await api("football_live");  
  const fixtures = result.fixtures || [];  

  if (!fixtures.length) {  
    $("footballResult").textContent =  
      "No live fixtures were returned by the provider.";  
    return;  
  }  

  $("footballResult").innerHTML = "";  

  fixtures.forEach(fixture => {  
    const row = document.createElement("p");  

    row.textContent =  
      (fixture.league || "Football") + " — " +  
      fixture.home + " " +  
      (fixture.homeGoals ?? "-") + " : " +  
      (fixture.awayGoals ?? "-") + " " +  
      fixture.away + " (" + fixture.status + ")";  

    $("footballResult").appendChild(row);  
  });  

} catch (error) {  
  $("footballResult").textContent =  
    "Football request failed: " + error.message;  
}

};
}

$("sendBtn").addEventListener("click", sendMessage);

$("prompt").addEventListener("keydown", event => {
if (event.key === "Enter" && !event.shiftKey) {

$("fileInput").click();
};

};

$("modalBackdrop").addEventListener("click", event => {

});

/* MOBILE HISTORY */

$("mobileHistoryBtn").onclick = async () => {

try {

const container = $("mobileHistoryItems");

(result.items || result.histories || []).forEach(item => {

document.querySelectorAll("[data-prompt]").forEach(button => {

$("prompt").focus();
};

/* START APPLICATION */
