
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b16">
<meta name="description" content="Maynard AI - Your intelligent multipurpose AI assistant.">

<title>Maynard AI</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    packages: {'[+]': ['ams']}
  },
  options: {
    skipHtmlTags: [
      'script', 'noscript', 'style',
      'textarea', 'pre', 'code'
    ]
  },
  chtml: {
    scale: 1.05,
    displayAlign: 'center',
    displayIndent: '0'
  },
  startup: {
    typeset: false
  }
};
</script>

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<style>
:root {
  --bg: #090b16;
  --panel: #111426;
  --panel2: #171b30;
  --border: rgba(255,255,255,.09);
  --text: #f5f5ff;
  --muted: #9ca3bd;
  --accent: #8b7cff;
  --accent2: #35d6cf;
  --danger: #ff646e;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at top left, #22214b 0, transparent 35%),
    radial-gradient(circle at bottom right, #123b48 0, transparent 30%),
    var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
  width: 255px;
  flex-shrink: 0;
  background: rgba(9,11,22,.88);
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  color: white;
  font-weight: bold;
  font-size: 20px;
}

.brand h2 {
  font-size: 18px;
  margin: 0;
}

.brand small {
  color: var(--muted);
}

.new-chat {
  background: linear-gradient(120deg,var(--accent),#6558c9);
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 13px;
  font-weight: bold;
}

.section-label {
  font-size: 11px;
  color: var(--muted);
  padding: 5px 9px;
  letter-spacing: 1px;
}

.modes {
  display: grid;
  gap: 6px;
}

.mode {
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted);
  padding: 11px;
  border-radius: 10px;
  text-align: left;
}

.mode:hover,
.mode.active {
  color: white;
  background: var(--panel2);
  border-color: var(--border);
}

.sidebar-bottom {
  margin-top: auto;
  display: grid;
  gap: 8px;
}

.sidebar-bottom button {
  background: var(--panel);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px;
}

/* MAIN */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  min-height: 65px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 22px;
  border-bottom: 1px solid var(--border);
  background: rgba(9,11,22,.55);
  backdrop-filter: blur(15px);
}

.topbar h3 {
  margin: 0;
  font-size: 16px;
}

.top-actions {
  display: flex;
  gap: 8px;
}

.top-actions button {
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 9px 12px;
}

.menu-button {
  display: none;
}

.content {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 25px 24px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* WELCOME */

.welcome {
  margin: auto;
  width: 100%;
  max-width: 720px;
  text-align: center;
  padding: 30px 0;
}

.welcome-logo {
  width: 75px;
  height: 75px;
  margin: 0 auto 20px;
  border-radius: 25px;
  display: grid;
  place-items: center;
  font-size: 32px;
  font-weight: bold;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
}

.welcome h1 {
  font-size: clamp(28px,5vw,42px);
  margin: 0 0 12px;
}

.welcome p {
  color: var(--muted);
  line-height: 1.7;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
  margin-top: 30px;
}

.suggestion {
  background: rgba(255,255,255,.045);
  color: white;
  border: 1px solid var(--border);
  border-radius: 13px;
  text-align: left;
  padding: 16px;
  line-height: 1.5;
}

.suggestion:hover {
  border-color: var(--accent);
}

/* CHAT */

.chat {
  display: flex;
  flex-direction: column;
  gap: 25px;
  padding-bottom: 30px;
}

.message {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.message.user {
  flex-direction: row-reverse;
}

.avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  font-size: 13px;
  font-weight: bold;
}

.message.user .avatar {
  background: #303650;
}

.bubble {
  max-width: min(85%,760px);
  background: rgba(20,24,43,.88);
  border: 1px solid var(--border);
  border-radius: 5px 16px 16px 16px;
  padding: 16px 18px;
  line-height: 1.85;
  overflow-wrap: anywhere;
}

.message.user .bubble {
  background: linear-gradient(135deg,#544ba0,#373d70);
  border-radius: 16px 5px 16px 16px;
}

.bubble p {
  margin: 0 0 15px;
  line-height: 1.9;
}

.bubble p:last-child {
  margin-bottom: 0;
}

.bubble h1,
.bubble h2,
.bubble h3 {
  line-height: 1.4;
  margin: 20px 0 12px;
}

.bubble ul,
.bubble ol {
  padding-left: 24px;
}

.bubble li {
  margin-bottom: 8px;
}

.bubble pre {
  background: #080b16;
  padding: 15px;
  border-radius: 10px;
  overflow-x: auto;
}

.bubble code {
  font-family: Consolas, monospace;
  background: rgba(0,0,0,.22);
  padding: 2px 5px;
  border-radius: 5px;
}

.bubble pre code {
  background: transparent;
  padding: 0;
}

.bubble blockquote {
  border-left: 3px solid var(--accent);
  margin: 12px 0;
  padding-left: 14px;
  color: #c8c9e4;
}

.bubble img.attachment-image {
  max-width: 100%;
  max-height: 350px;
  object-fit: contain;
  border-radius: 12px;
  margin-top: 10px;
  display: block;
}

/* MATHEMATICS */

.bubble mjx-container {
  color: #e8e8ff !important;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
}

.bubble mjx-container[display="true"] {
  display: block;
  width: 100%;
  margin: 28px 0 !important;
  padding: 22px 14px;
  background: linear-gradient(
    120deg,
    rgba(139,124,255,.09),
    rgba(53,214,207,.055)
  );
  border: 1px solid rgba(160,180,255,.13);
  border-radius: 13px;
  text-align: center;
  line-height: 2;
}

.bubble mjx-math {
  font-size: 1.1em;
}

.message.user .bubble mjx-container {
  color: white !important;
}

/* MESSAGE ACTIONS */

.message-tools {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.message-tools button {
  background: transparent;
  color: var(--muted);
  border: 0;
  font-size: 12px;
  padding: 5px;
}

.message-tools button:hover {
  color: white;
}

/* COMPOSER */

.composer-wrap {
  position: sticky;
  bottom: 0;
  padding: 14px 20px 20px;
  background: linear-gradient(transparent,var(--bg) 25%);
}

.composer {
  max-width: 850px;
  margin: auto;
  background: rgba(22,26,46,.96);
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 18px;
  padding: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,.25);
}

.attachment-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}

.attachment-item {
  background: #272d48;
  border-radius: 9px;
  padding: 7px 9px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

.attachment-item button {
  background: transparent;
  border: 0;
  color: #ff9292;
}

.composer textarea {
  width: 100%;
  min-height: 55px;
  max-height: 180px;
  resize: vertical;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  padding: 10px;
  font-size: 15px;
}

.composer textarea::placeholder {
  color: #8e94ad;
}

.composer-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.action-left,
.action-right {
  display: flex;
  gap: 7px;
  align-items: center;
}

.icon-btn {
  background: #252b44;
  border: 1px solid var(--border);
  color: white;
  padding: 10px 12px;
  border-radius: 10px;
}

.send-btn {
  background: linear-gradient(135deg,var(--accent),#6258c9);
  color: white;
  border: 0;
  padding: 11px 17px;
  border-radius: 10px;
  font-weight: bold;
}

.send-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.status {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 10px;
}

/* LOADING */

.typing {
  display: flex;
  gap: 5px;
  padding: 8px;
}

.typing span {
  width: 7px;
  height: 7px;
  background: var(--accent2);
  border-radius: 50%;
  animation: pulse 1s infinite alternate;
}

.typing span:nth-child(2) {
  animation-delay: .2s;
}

.typing span:nth-child(3) {
  animation-delay: .4s;
}

@keyframes pulse {
  to {
    opacity: .2;
    transform: translateY(-4px);
  }
}

.hidden {
  display: none !important;
}

/* MOBILE */

@media(max-width:760px) {
  .sidebar {
    position: fixed;
    z-index: 20;
    top: 0;
    bottom: 0;
    left: -270px;
    transition: left .25s;
    box-shadow: 10px 0 30px rgba(0,0,0,.3);
  }

  .sidebar.open {
    left: 0;
  }

  .menu-button {
    display: inline-block;
  }

  .topbar {
    padding: 10px 12px;
  }

  .content {
    padding: 18px 12px;
  }

  .bubble {
    max-width: 88%;
    padding: 13px;
  }

  .composer-wrap {
    padding: 10px;
  }

  .suggestions {
    grid-template-columns: 1fr;
  }

  .bubble mjx-container[display="true"] {
    padding: 18px 8px;
    margin: 24px 0 !important;
  }

  .bubble mjx-math {
    font-size: 1em;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">M</div>
      <div>
        <h2>Maynard AI</h2>
        <small>Your intelligent assistant</small>
      </div>
    </div>

    <button class="new-chat" id="newChat">
      + New conversation
    </button>

    <div>
      <div class="section-label">ASSISTANT MODES</div>

      <div class="modes" id="modes">
        <button class="mode active" data-mode="general">🌐 General</button>
        <button class="mode" data-mode="education">🎓 Education</button>
        <button class="mode" data-mode="writing">✍️ Writing</button>
        <button class="mode" data-mode="coding">💻 Coding</button>
        <button class="mode" data-mode="research">🔎 Research</button>
        <button class="mode" data-mode="business">💼 Business</button>
        <button class="mode" data-mode="creative">🎨 Creative</button>
        <button class="mode" data-mode="translator">🌍 Translator</button>
        <button class="mode" data-mode="summarizer">📄 Summarizer</button>
      </div>
    </div>

    <div class="sidebar-bottom">
      <button id="exportBtn">⬇ Export conversation</button>
      <button id="clearBtn">🗑 Clear conversation</button>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="top-actions menu-button" id="menuBtn">☰</button>
        <h3 id="modeTitle">General Assistant</h3>
      </div>

      <div class="top-actions">
        <button id="voiceToggle">🔊 Voice</button>
      </div>
    </header>

    <section class="content">

      <div class="welcome" id="welcome">
        <div class="welcome-logo">M</div>
        <h1>Welcome to Maynard AI</h1>
        <p>
          Your intelligent multipurpose assistant.
          Ask questions, learn, write, code, translate and explore ideas.
        </p>

        <div class="suggestions">
          <button class="suggestion" data-prompt="Explain quadratic equations step by step with examples.">
            🎓 <strong>Learn something</strong><br>
            Explain a difficult topic.
          </button>

          <button class="suggestion" data-prompt="Help me write a professional letter.">
            ✍️ <strong>Write something</strong><br>
            Create polished writing.
          </button>

          <button class="suggestion" data-prompt="Help me build a simple website using HTML, CSS and JavaScript.">
            💻 <strong>Build something</strong><br>
            Get help with coding.
          </button>

          <button class="suggestion" data-prompt="Give me five creative ideas for a new project.">
            💡 <strong>Explore ideas</strong><br>
            Discover creative possibilities.
          </button>
        </div>
      </div>

      <div class="chat hidden" id="chat"></div>

    </section>

    <div class="composer-wrap">
      <div class="composer">

        <div class="attachment-list" id="attachmentList"></div>

        <textarea
          id="messageInput"
          placeholder="Message Maynard AI..."
          rows="2"
        ></textarea>

        <div class="composer-actions">

          <div class="action-left">
            <button class="icon-btn" id="attachBtn" title="Attach file">📎</button>
            <button class="icon-btn" id="micBtn" title="Voice input">🎙</button>
            <input
              type="file"
              id="fileInput"
              accept="image/jpeg,image/png,image/webp,.txt,.md,.csv,.tsv"
              multiple
              hidden
            >
          </div>

          <div class="action-right">
            <button class="send-btn" id="sendBtn">Send ➤</button>
          </div>

        </div>
      </div>

      <div class="status">
        Maynard AI can make mistakes. Check important answers.
      </div>
    </div>

  </main>

</div>

<script>
const $ = id => document.getElementById(id);

const messageInput = $("messageInput");
const chat = $("chat");
const welcome = $("welcome");
const sendBtn = $("sendBtn");
const fileInput = $("fileInput");
const attachmentList = $("attachmentList");

let currentMode = "general";
let conversation = [];
let attachments = [];
let busy = false;
let voiceEnabled = false;

const modeNames = {
  general: "General Assistant",
  education: "Education Assistant",
  writing: "Writing Assistant",
  coding: "Coding Assistant",
  research: "Research Assistant",
  business: "Business Assistant",
  creative: "Creative Assistant",
  translator: "Translator",
  summarizer: "Summarizer"
};

function saveHistory() {
  try {
    localStorage.setItem(
      "maynard_history",
      JSON.stringify(conversation.slice(-50))
    );
  } catch (error) {
    console.warn("Could not save conversation:", error);
  }
}

function loadHistory() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("maynard_history") || "[]"
    );

    if (Array.isArray(saved) && saved.length) {
      conversation = saved;
      renderConversation();
    }
  } catch (error) {
    conversation = [];
  }
}

function showChat() {
  welcome.classList.add("hidden");
  chat.classList.remove("hidden");
}

function showWelcome() {
  chat.classList.add("hidden");
  welcome.classList.remove("hidden");
}

function renderConversation() {
  chat.innerHTML = "";

  if (!conversation.length) {
    showWelcome();
    return;
  }

  showChat();

  conversation.forEach((item, index) => {
    addMessage(item.role, item.content, false, index);
  });
}

function formatMarkdown(text) {
  if (!window.marked || !window.DOMPurify) {
    return escapeHTML(text).replace(/\n/g, "<br>");
  }

  const html = marked.parse(text, {
    breaks: true,
    gfm: true
  });

  return DOMPurify.sanitize(html);
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function renderMath(element) {
  if (!window.MathJax || !MathJax.typesetPromise) {
    return;
  }

  MathJax.typesetPromise([element]).catch(error => {
    console.warn("Math rendering error:", error);
  });
}

function addMessage(role, content, save = true, index = null) {
  const message = document.createElement("div");
  message.className = "message " + (role === "user" ? "user" : "assistant");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "You" : "M";

  const wrapper = document.createElement("div");
  wrapper.style.minWidth = "0";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = formatMarkdown(content);

  wrapper.appendChild(bubble);

  if (role === "assistant") {
    const tools = document.createElement("div");
    tools.className = "message-tools";

    const copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.onclick = () => copyText(content, copy);

    const speak = document.createElement("button");
    speak.textContent = "Read aloud";
    speak.onclick = () => speakText(content);

    tools.append(copy, speak);
    wrapper.appendChild(tools);
  }

  message.append(avatar, wrapper);
  chat.appendChild(message);

  renderMath(bubble);

  if (save) {
    chat.scrollTop = chat.scrollHeight;
  }

  return message;
}

async function copyText(text, button) {
  try {
    await navigator.clipboard.writeText(text);
    button.textContent = "Copied!";
    setTimeout(() => button.textContent = "Copy", 1500);
  } catch {
    alert("Copy was not available on this device.");
  }
}

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    alert("Speech output is not supported in this browser.");
    return;
  }

  speechSynthesis.cancel();

  const cleanText = text
    .replace(/[#*`$\\]/g, " ")
    .replace(/\s+/g, " ");

  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = "en-US";
  utterance.rate = 1;

  speechSynthesis.speak(utterance);
}

function showTyping() {
  const element = document.createElement("div");
  element.className = "message assistant";
  element.id = "typingIndicator";

  element.innerHTML = `
    <div class="avatar">M</div>
    <div class="bubble">
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
      <small>Maynard AI is thinking...</small>
    </div>
  `;

  chat.appendChild(element);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  $("typingIndicator")?.remove();
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      const image = new Image();

      image.onload = () => {
        const canvas = document.createElement("canvas");

        const maxDimension = 1280;
        const scale = Math.min(
          1,
          maxDimension / Math.max(image.width, image.height)
        );

        canvas.width = Math.round(image.width * scale);
        canvas.height = Math.round(image.height * scale);

        const context = canvas.getContext("2d");
        context.drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );

        resolve(
          canvas.toDataURL("image/jpeg", 0.72)
        );
      };

      image.onerror = reject;
      image.src = reader.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function updateAttachmentList() {
  attachmentList.innerHTML = "";

  attachments.forEach((file, index) => {
    const item = document.createElement("div");
    item.className = "attachment-item";

    const name = document.createElement("span");
    name.textContent = file.name;

    const remove = document.createElement("button");
    remove.textContent = "×";
    remove.title = "Remove attachment";

    remove.onclick = () => {
      attachments.splice(index, 1);
      updateAttachmentList();
    };

    item.append(name, remove);
    attachmentList.appendChild(item);
  });
}

$("attachBtn").onclick = () => fileInput.click();

fileInput.onchange = async () => {
  const files = Array.from(fileInput.files || []);

  for (const file of files) {
    if (attachments.length >= 5) {
      alert("You can attach up to five files.");
      break;
    }

    const isImage = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ].includes(file.type);

    const isText =
      /\.(txt|md|csv|tsv)$/i.test(file.name);

    if (!isImage && !isText) {
      alert("Supported files: JPG, PNG, WEBP, TXT, MD, CSV and TSV.");
      continue;
    }

    if (file.size > 12 * 1024 * 1024) {
      alert("Each file must be smaller than 12 MB.");
      continue;
    }

    try {
      let data;

      if (isImage) {
        data = await resizeImage(file);
      } else {
        data = await file.text();

        if (data.length > 20000) {
          data = data.slice(0, 20000);
        }
      }

      attachments.push({
        name: file.name,
        type: isImage ? "image/jpeg" : file.type || "text/plain",
        data
      });

    } catch (error) {
      alert("Could not read " + file.name);
    }
  }

  updateAttachmentList();
  fileInput.value = "";
};

async function sendMessage() {
  if (busy) return;

  const message = messageInput.value.trim();

  if (!message && !attachments.length) return;

  const currentAttachments = attachments.slice();

  attachments = [];
  updateAttachmentList();

  const displayText = message || "Please examine my attachment.";

  const userItem = {
    role: "user",
    content: displayText
  };

  conversation.push(userItem);

  showChat();
  addMessage("user", displayText);

  currentAttachments.forEach(file => {
    if (file.type.startsWith("image/")) {
      const lastMessage = chat.lastElementChild;

      if (lastMessage) {
        const image = document.createElement("img");
        image.className = "attachment-image";
        image.src = file.data;
        image.alt = file.name;

        lastMessage.querySelector(".bubble")?.appendChild(image);
      }
    } else {
      addMessage("user", "Attached file: " + file.name);
    }
  });

  messageInput.value = "";
  messageInput.style.height = "55px";

  saveHistory();
  busy = true;
  sendBtn.disabled = true;

  showTyping();

  try {
    const history = conversation
      .slice(-13, -1)
      .map(item => ({
        role: item.role,
        content: item.content
      }));

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        mode: currentMode,
        history,
        attachments: currentAttachments
      })
    });

    const result = await response.json();

    removeTyping();

    if (!response.ok || !result.success) {
      throw new Error(
        result.error || "Maynard AI could not complete your request."
      );
    }

    conversation.push({
      role: "assistant",
      content: result.reply
    });

    addMessage("assistant", result.reply);

    saveHistory();

    if (voiceEnabled) {
      speakText(result.reply);
    }

  } catch (error) {
    removeTyping();

    const errorMessage =
      error.message || "Something went wrong. Please try again.";

    addMessage(
      "assistant",
      "I couldn't complete that request.\n\n" + errorMessage
    );

  } finally {
    busy = false;
    sendBtn.disabled = false;
    messageInput.focus();
  }
}

sendBtn.onclick = sendMessage;

messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

messageInput.addEventListener("input", () => {
  messageInput.style.height = "55px";
  messageInput.style.height =
    Math.min(messageInput.scrollHeight, 180) + "px";
});

/* MODE SELECTION */

$("modes").addEventListener("click", event => {
  const button = event.target.closest(".mode");

  if (!button) return;

  currentMode = button.dataset.mode;

  document.querySelectorAll(".mode").forEach(item => {
    item.classList.toggle("active", item === button);
  });

  $("modeTitle").textContent = modeNames[currentMode];

  $("sidebar").classList.remove("open");
});

/* WELCOME SUGGESTIONS */

$("welcome").addEventListener("click", event => {
  const button = event.target.closest(".suggestion");

  if (!button) return;

  messageInput.value = button.dataset.prompt;
  messageInput.focus();
  sendMessage();
});

/* NEW CHAT */

$("newChat").onclick = () => {
  if (busy) return;

  conversation = [];
  attachments = [];

  updateAttachmentList();
  saveHistory();
  chat.innerHTML = "";

  showWelcome();

  $("sidebar").classList.remove("open");
};

/* CLEAR CHAT */

$("clearBtn").onclick = () => {
  if (busy) return;

  if (!confirm("Clear this conversation?")) return;

  conversation = [];
  attachments = [];

  updateAttachmentList();
  saveHistory();
  chat.innerHTML = "";

  showWelcome();
};

/* EXPORT */

$("exportBtn").onclick = () => {
  if (!conversation.length) {
    alert("There is no conversation to export.");
    return;
  }

  const text = conversation.map(item => {
    const title = item.role === "user"
      ? "YOU"
      : "MAYNARD AI";

    return title + "\n" + item.content;
  }).join("\n\n-------------------------\n\n");

  const blob = new Blob([text], {
    type: "text/plain;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "Maynard-AI-conversation.txt";
  link.click();

  URL.revokeObjectURL(url);
};

/* SIDEBAR */

$("menuBtn").onclick = () => {
  $("sidebar").classList.toggle("open");
};

/* VOICE OUTPUT */

$("voiceToggle").onclick = () => {
  voiceEnabled = !voiceEnabled;

  $("voiceToggle").textContent =
    voiceEnabled ? "🔊 Voice On" : "🔊 Voice";
};

/* VOICE INPUT */

$("micBtn").onclick = () => {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onresult = event => {
    const transcript =
      event.results[0][0].transcript;

    messageInput.value +=
      (messageInput.value ? " " : "") + transcript;

    messageInput.focus();
  };

  recognition.onerror = () => {
    alert("Voice input could not be completed.");
  };

  recognition.start();
};

/* START */

loadHistory();

if (window.MathJax && MathJax.startup) {
  MathJax.startup.promise.then(() => {
    document.querySelectorAll(".bubble").forEach(renderMath);
  });
}
</script>

</body>
</html>
